name: My JILL WORK account certification

# Source-only: isolated WORK branch; no app deployment, LIVE credentials,
# privileged Shopify mutation, theme publish or Apps Script write.
on:
  push:
    branches:
      - jill/rewards-work
  pull_request:
    branches:
      - jill/theme-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jill-account-work-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account:
    name: Verify single Rewards owner and WORK account contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WORK source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and run all repository guards
        run: npm install

      - name: Verify My JILL extension and canary boundaries
        run: npm run check:account-hub && npm run test:account-hub-canary && npm run test:account-hub-summary && npm run test:account-hub-template

      - name: Verify authenticated Coupons projections
        run: npm run test:customer-coupons

      - name: Verify shared Rewards v13 state and transaction
        run: npm run check:rewards && npm run test:rewards && npm run test:rewards-redemption

      - name: Verify public offers and legacy Coupons compatibility
        run: npm run test:public-promotions && npm run test:account-coupons

      - name: Ensure no tracked files were mutated
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Tests mutated tracked WORK source." >&2
            git status --short
            exit 1
          fi

  windows:
    name: Verify WORK postinstall on Windows Node 24
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WORK source
        uses: actions/checkout@v4

      - name: Match local Windows Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Print runtime versions
        shell: pwsh
        run: |
          node --version
          npm.cmd --version

      - name: Reproduce Windows npm install and full postinstall guard
        shell: pwsh
        run: npm.cmd install

      - name: Run new account-transfer preflight explicitly
        shell: pwsh
        run: node scripts/check-account-transfer-readiness.mjs

      - name: Ensure tests did not change tracked source
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { Write-Error "Tests changed tracked source: $dirty"; exit 1 }

  gateway:
    name: Package WORK Render gateway (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WORK source
        uses: actions/checkout@v4

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install only isolated gateway dependencies
        run: npm install --prefix services/custom-order-work-gateway --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Validate launch entrypoint and HTTP runtime
        run: |
          node --check services/custom-order-work-gateway/server.mjs
          node --check services/custom-order-work-gateway/http-handler.mjs
          node --check services/custom-order-work-gateway/rate-limit.mjs
          node -e "import('./services/custom-order-work-gateway/server.mjs').then(() => console.log('Render gateway bundle imports successfully'))"

      - name: Test signed proxy and Redis failure behaviors
        run: node scripts/test-render-custom-order-gateway.mjs

      - name: Verify no tracked source mutation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
