name: My JILL WORK account certification

# Source-only: isolated WORK branch; no app deployment, LIVE credentials,
# privileged Shopify mutation, theme publish or Apps Script write.
on:
  push:
    branches:
      - jill/rewards-work
  pull_request:
    branches:
      - jill/theme-core
      - jill/rewards-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jill-account-work-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account:
    name: Verify single Rewards owner and WORK account contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WORK source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and run all repository guards
        run: npm install

      - name: Verify My JILL extension and canary boundaries
        run: npm run check:account-hub && npm run test:account-hub-canary && npm run test:account-hub-summary && npm run test:account-hub-template

      - name: Verify authenticated Coupons projections
        run: npm run test:customer-coupons

      - name: Verify shared Rewards v13 state and transaction
        run: npm run check:rewards && npm run test:rewards && npm run test:rewards-redemption

      - name: Verify private My JILL Custom Orders and customer A/B isolation
        run: |
          npm run test:custom-order-ownership
          npm run test:custom-order-account-read
          npm run test:customer-custom-orders

      - name: Verify WORK merchant online staff authorization and owner registry
        run: npm run test:work-qa-read-audit && npm run test:work-hq-branding && npm run test:work-hq-merchant-release && npm run test:jill-private-catalog && npm run test:work-hq-stage-existing-key && npm run test:work-hq-existing-merchant-key && npm run test:work-hq-inbox-rollout && npm run test:work-hq-google-merchant-feed && npm run test:work-merchant-inbox && npm run test:work-hq-inbox-ui && npm run test:work-hq-request-detail && npm run test:work-hq-source-cache && npm run test:work-hq-google-source-cache && npm run test:work-hq-merchant-command && npm run test:work-hq-mail-outbox && npm run test:work-hq-ui-rollout && npm run test:jill-merchant-auth && npm run test:jill-order-desk-home && npm run test:jill-order-desk-work-config && npm run test:work-merchant-runtime-audit && npm run test:jill-shopify-host-wiring && npm run test:jill-shopify-d1-sessions && npm run test:jill-shopify-runtime-composition && npm run test:jill-app-home-scaffold && npm run test:jill-work-owner-setup && npm run test:jill-app-home-canary && npm run test:work-canary-runtime-audit && npm run test:work-canary-oauth-manifest && npm run test:work-owner-commissioning

      - name: Verify public offers and legacy Coupons compatibility
        run: npm run test:public-promotions && npm run test:account-coupons

      - name: Ensure no tracked files were mutated
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Tests mutated tracked WORK source." >&2
            git status --short
            exit 1
          fi

  windows:
    name: Verify WORK postinstall on Windows Node 24
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WORK source
        uses: actions/checkout@v4

      - name: Match local Windows Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Print runtime versions
        shell: pwsh
        run: |
          node --version
          npm.cmd --version

      - name: Reproduce Windows npm install and full postinstall guard
        shell: pwsh
        run: npm.cmd install

      - name: Run new account-transfer preflight explicitly
        shell: pwsh
        run: node scripts/check-account-transfer-readiness.mjs

      - name: Ensure tests did not change tracked source
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { Write-Error "Tests changed tracked source: $dirty"; exit 1 }

  cloudflare:
    name: Package WORK Cloudflare Worker (dry run only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WORK branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Workers bundler
        run: npm install --prefix services/custom-order-cloudflare --no-audit --no-fund

      - name: Dry-run compile Worker and SQLite Durable Object (no account login)
        working-directory: services/custom-order-cloudflare
        run: npm run build

      - name: Dry-run compile isolated WORK merchant Worker (no deployment)
        working-directory: services/custom-order-cloudflare
        run: npx wrangler deploy --dry-run --config ../jill-order-desk/wrangler.toml --outdir .wrangler-dist-merchant

      - name: Check signed WORK gateway and shared SQLite quotas
        run: node scripts/test-cloudflare-custom-order-gateway.mjs

      - name: Verify no tracked files changed
        run: test -z "$(git status --porcelain --untracked-files=no)"

  merchant_app_home:
    name: Build WORK embedded Shopify Admin App Home (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WORK source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated App Home dependencies
        working-directory: services/jill-order-desk/app-home
        run: npm install --no-audit --no-fund
      - name: Validate encrypted D1 with actual Shopify SDK Session
        working-directory: services/jill-order-desk/app-home
        run: npm run test:shopify-session-real
      - name: Initialize real Shopify SDK for WORK canary with synthetic credentials
        working-directory: services/jill-order-desk/app-home
        run: npm run test:shopify-real-init
      - name: Validate Shopify Admin and Cloudflare host types
        working-directory: services/jill-order-desk/app-home
        run: npm run typecheck
      - name: Build real React Router Cloudflare App Home (no deployment)
        working-directory: services/jill-order-desk/app-home
        run: npm run build
      - name: Build isolated WORK canary App Home (no deployment)
        working-directory: services/jill-order-desk/app-home
        env:
          JILL_BUILD_TARGET: canary
        run: npm run build
      - name: Verify exact WORK canary deployment manifest and dry-run package
        working-directory: services/jill-order-desk/app-home
        run: |
          node ../../../scripts/check-jill-app-home-canary-manifest.mjs
          npx wrangler deploy --dry-run --config dist/server/wrangler.json --outdir .wrangler-canary-dry-run

      - name: Validate OAuth-only canary manifest and Wrangler package (no deployment)
        working-directory: services/jill-order-desk/app-home
        run: |
          node ../../../scripts/prepare-work-canary-oauth-manifest.mjs
          npx wrangler deploy --dry-run --config dist/server/wrangler.oauth-canary.json --outdir .wrangler-oauth-canary-dry-run
      - name: Validate single-use WORK Owner commissioning manifest only (no deployment)
        working-directory: services/jill-order-desk/app-home
        run: |
          node ../../../scripts/prepare-work-canary-owner-commissioning.mjs
          npx wrangler deploy --dry-run --config dist/server/wrangler.owner-commissioning.json --outdir .wrangler-owner-dry-run

      - name: Exercise Shopify routes in actual local Cloudflare workerd
        working-directory: services/jill-order-desk/app-home
        run: npm run test:workerd-oauth

      - name: Certify deployable Cloudflare WORK canary bundle (no deployment)
        working-directory: services/jill-order-desk/app-home
        run: |
          echo "Cloudflare candidate output:"
          find dist -maxdepth 6 -type f \( -name wrangler.json -o -name '_worker.js' -o -name 'index.js' \) | sort
          manifest="$(find dist -maxdepth 6 -type f -name wrangler.json | head -n 1)"
          if [ -z "$manifest" ]; then
            echo "No generated deployable Wrangler manifest found. Do not provision secrets or deploy this host."
            exit 1
          fi
          echo "Deploy manifest: $manifest"
      - name: Verify no tracked files were mutated
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            exit 1
          fi
