name: Fix Coupons patch build validation

on:
  push:
    branches:
      - jill/coupons-live-promotions
    paths:
      - '.github/workflows/fix-coupons-patch-build.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/coupons-live-promotions
          fetch-depth: 0

      - name: Defer production bundle validation to canonical deploy workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-coupons-live-promotions.yml')
          source = path.read_text()
          old = '      - name: Build Shopify app extensions\n        run: npx shopify app build\n'
          new = '      - name: Build validation owner\n        run: echo "Canonical customer-account deploy workflow validates and bundles the linked Shopify app."\n'
          assert old in source, 'build validation anchor missing'
          path.write_text(source.replace(old, new, 1))
          PY

          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add .github/workflows/patch-coupons-live-promotions.yml
          git diff --cached --check
          git commit -m 'Defer Coupons bundle check to canonical deploy'
          git push origin HEAD:jill/coupons-live-promotions
