name: One-time reward color patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-reward-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch reward colors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('extensions/jill-account-dashboard/src/Dashboard.jsx')
          text = path.read_text()

          old_use = '<s-text tone="accent">Use Coupon</s-text>'
          new_use = '<s-text tone="info">Use Coupon</s-text>'
          if old_use not in text:
              raise SystemExit('Expected Use Coupon accent text not found')
          text = text.replace(old_use, new_use, 1)

          old_next = '<s-text tone="accent">Next Reward ★</s-text>'
          new_next = '<s-link onClick={() => setShowAllRewards((current) => !current)}>Next Reward ★</s-link>'
          if old_next not in text:
              raise SystemExit('Expected Next Reward accent text not found')
          text = text.replace(old_next, new_next, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-reward-colors.yml
          git config user.name 'JILL Rewards Housekeeping'
          git config user.email 'info@jillonlinestore.com'
          git add extensions/jill-account-dashboard/src/Dashboard.jsx .github/workflows/one-time-reward-colors.yml
          git commit -m 'Match reward colors to JILL brand states'
          git push origin main
