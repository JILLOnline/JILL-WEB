name: Apply Custom Order final audit

on:
  push:
    branches:
      - jill/custom-order-final-audit
    paths:
      - .github/workflows/apply-custom-order-final-audit.yml
      - .github/apply_custom_order_final_audit.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/custom-order-final-audit
          fetch-depth: 0

      - name: Apply audited Custom Order fixes
        run: python3 .github/apply_custom_order_final_audit.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run final Custom Order validation
        run: |
          npm run check:theme
          npm run check:theme-settings
          npm run test:form-engine
          npm run test:product-capabilities
          npm run test:product-options
          npm run test:personalization
          npm run test:quantity
          npm run test:variant-allocation
          npm run test:custom-order-integration
          npm run test:custom-order-catalog-groups
          npm run test:custom-order-item-naming
          npm run check:custom-order
          npm run check:rewards
          npm run test:rewards

      - name: Final regression guards
        run: |
          python3 -c "from pathlib import Path; s=Path('theme/sections/main-custom-order.liquid').read_text(); r=Path('theme/assets/jill-custom-order.js').read_text(); c=Path('theme/assets/jill-forms.css').read_text(); assert 'AKfycbxXruH-shyIEGbxIpyJtd4KrAMaN0J3Ov7icdae_MkMvig8I_Y_fm2OJ9cRJiZ-IzU7jA' in s; assert 'AKfycbwjFDQxhjc4RDu8T0gSweQf70Y5TheTyWZ6KoVDux6Hx-Ue9jdE7E5Enl5nyxjJpo2W' not in s; assert 'event_date' not in s and 'event_date' not in r; assert 'needDate.value = earliestNeedDate' not in r; assert 'JILLPersonalization.createState' in r; assert 'data-jill-custom-order-full-profile' in s; assert 'var(--jill-botanical-field)' in c"

      - name: Commit final audited changes and remove temporary runner
        run: |
          git rm .github/workflows/apply-custom-order-final-audit.yml .github/apply_custom_order_final_audit.py
          git config user.name "JILL Web Automation"
          git config user.email "info@jillonlinestore.com"
          git add theme scripts docs
          git commit -m "Finalize Custom Order audit fixes"
          git push origin HEAD:jill/custom-order-final-audit
