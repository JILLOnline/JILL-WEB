name: Apply Custom Order final audit

on:
  push:
    branches:
      - jill/custom-order-final-audit
    paths:
      - .github/workflows/apply-custom-order-final-audit.yml
      - .github/apply_custom_order_final_audit.py
      - .github/fix_custom_order_audit_guard.py
      - .github/fix_custom_order_liquid.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/custom-order-final-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct temporary audit guard generator
        run: python3 .github/fix_custom_order_audit_guard.py
      - name: Apply audited Custom Order fixes
        run: python3 .github/apply_custom_order_final_audit.py
      - name: Correct Date Needed Liquid render
        run: python3 .github/fix_custom_order_liquid.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Theme architecture guard
        run: npm run check:theme
      - name: Theme settings guard
        run: npm run check:theme-settings
      - name: Form engine tests
        run: npm run test:form-engine
      - name: Product capabilities tests
        run: npm run test:product-capabilities
      - name: Product Options tests
        run: npm run test:product-options
      - name: Personalization tests
        run: npm run test:personalization
      - name: Quantity tests
        run: npm run test:quantity
      - name: Variant allocation tests
        run: npm run test:variant-allocation
      - name: Custom Order integration tests
        run: npm run test:custom-order-integration
      - name: Custom Order catalog tests
        run: npm run test:custom-order-catalog-groups
      - name: Custom Order naming tests
        run: npm run test:custom-order-item-naming
      - name: Custom Order contract guard
        run: npm run check:custom-order
      - name: Rewards architecture guard
        run: npm run check:rewards
      - name: Rewards tests
        run: npm run test:rewards
      - name: Shopify Theme Check
        run: npx shopify theme check --path theme
      - name: Final regression guards
        run: |
          python3 -c "from pathlib import Path; s=Path('theme/sections/main-custom-order.liquid').read_text(); r=Path('theme/assets/jill-custom-order.js').read_text(); c=Path('theme/assets/jill-forms.css').read_text(); assert 'AKfycbxXruH-shyIEGbxIpyJtd4KrAMaN0J3Ov7icdae_MkMvig8I_Y_fm2OJ9cRJiZ-IzU7jA' in s; assert 'AKfycbwjFDQxhjc4RDu8T0gSweQf70Y5TheTyWZ6KoVDux6Hx-Ue9jdE7E5Enl5nyxjJpo2W' not in s; assert 'event_date' not in s and 'event_date' not in r; assert 'needDate.value = earliestNeedDate' not in r; assert 'JILLPersonalization.createState' in r; assert 'data-jill-custom-order-full-profile' in s; assert 'var(--jill-botanical-field)' in c; assert \"assign date_needed_help = 'custom_order.planning.date_needed_help' | t\" in s; assert 'help: date_needed_help' in s"
      - name: Commit final audited changes and remove temporary runner
        run: |
          git rm .github/workflows/apply-custom-order-final-audit.yml .github/apply_custom_order_final_audit.py .github/fix_custom_order_audit_guard.py .github/fix_custom_order_liquid.py
          git config user.name "JILL Web Automation"
          git config user.email "info@jillonlinestore.com"
          git add theme scripts docs
          git commit -m "Finalize Custom Order audit fixes"
          git push origin HEAD:jill/custom-order-final-audit
