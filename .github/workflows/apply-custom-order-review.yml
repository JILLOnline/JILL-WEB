name: Apply Custom Order Review Rebuild

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - .github/workflows/apply-custom-order-review.yml
      - scripts/apply-custom-order-review-packed.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: jill/theme-core

      - name: Apply Review presentation rebuild
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { inflateRawSync } from 'node:zlib';

          const packed = fs.readFileSync('scripts/apply-custom-order-review-packed.mjs', 'utf8');
          const payload = packed.match(/const payload = '([^']+)'/)?.[1];
          if (!payload) throw new Error('Packed Review payload was not found.');

          const gzip = Buffer.from(payload, 'base64');
          if (gzip[0] !== 0x1f || gzip[1] !== 0x8b || gzip[2] !== 0x08) throw new Error('Packed Review payload is not gzip data.');
          const flags = gzip[3];
          let offset = 10;
          if (flags & 0x04) {
            const extraLength = gzip.readUInt16LE(offset);
            offset += 2 + extraLength;
          }
          if (flags & 0x08) while (gzip[offset++] !== 0 && offset < gzip.length) {}
          if (flags & 0x10) while (gzip[offset++] !== 0 && offset < gzip.length) {}
          if (flags & 0x02) offset += 2;
          if (offset >= gzip.length - 8) throw new Error('Packed Review payload header is invalid.');

          const source = inflateRawSync(gzip.subarray(offset, -8)).toString('utf8');
          fs.writeFileSync('/tmp/jill-custom-order-review-patch.mjs', source);
          await import('file:///tmp/jill-custom-order-review-patch.mjs');
          NODE

      - name: Validate touched runtime and integration guard
        run: |
          set -euo pipefail
          node --check theme/assets/jill-custom-order.js
          node scripts/test-custom-order-integration.mjs
          ! grep -R "!important" theme/assets/jill-forms.css theme/assets/jill-custom-order.js theme/sections/main-custom-order.liquid
          ! grep -R "MutationObserver" theme/assets/jill-custom-order.js

      - name: Remove one-time applicator and commit canonical source
        run: |
          set -euo pipefail
          rm -f scripts/apply-custom-order-review-packed.mjs .github/workflows/apply-custom-order-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Custom Order review presentation"
          git push origin HEAD:jill/theme-core
