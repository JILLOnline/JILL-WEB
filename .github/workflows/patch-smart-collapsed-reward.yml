name: Patch smart collapsed reward

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-smart-collapsed-reward.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Advance collapsed reward to next tier
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('extensions/jill-account-dashboard/src/Dashboard.jsx')
          text = path.read_text()

          anchor = "  const nextTier = REWARD_TIERS.find((tier) => points < tier.points) || null;\n"
          replacement = anchor + "  const collapsedTier = nextTier || REWARD_TIERS[REWARD_TIERS.length - 1];\n"

          if anchor not in text:
            raise SystemExit('Could not find nextTier anchor.')
          text = text.replace(anchor, replacement, 1)

          old = "(showAllRewards ? REWARD_TIERS : REWARD_TIERS.slice(0, 1)).map("
          new = "(showAllRewards ? REWARD_TIERS : [collapsedTier]).map("

          if old not in text:
            raise SystemExit('Could not find collapsed rewards tier selection.')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-smart-collapsed-reward.yml
          git config user.name "JILL Rewards automation"
          git config user.email "info@jillonlinestore.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx .github/workflows/patch-smart-collapsed-reward.yml
          git commit -m "Advance collapsed reward to next milestone"
          git push origin HEAD:main
