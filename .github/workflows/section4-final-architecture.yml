name: Section 4 Final Architecture

on:
  push:
    branches:
      - jill/custom-order-section4-system-pass

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: jill/custom-order-section4-system-pass
          fetch-depth: 0

      - name: Consolidate Section 4 ownership
        shell: python
        run: |
          from pathlib import Path

          section_path = Path('theme/sections/main-custom-order.liquid')
          section = section_path.read_text()
          old_profile = '''                  assign capability_profile = blank
                  assign capability_metafield = catalog_product.metafields.custom.jill_product_capabilities
                  if capability_metafield != blank and capability_metafield.type == 'json'
                    assign capability_profile = capability_metafield.value
                  endif
'''
          new_profile = '''                  assign capability_profile = blank
                  for capability_collection in catalog_product.collections
                    assign custom_order_capability_metafield = capability_collection.metafields.custom.jill_custom_order_capabilities
                    if custom_order_capability_metafield != blank and custom_order_capability_metafield.type == 'json'
                      assign capability_profile = custom_order_capability_metafield.value
                      break
                    endif
                  endfor
                  if capability_profile == blank
                    assign capability_metafield = catalog_product.metafields.custom.jill_product_capabilities
                    if capability_metafield != blank and capability_metafield.type == 'json'
                      assign capability_profile = capability_metafield.value
                    endif
                  endif
'''
          if old_profile not in section:
              raise SystemExit('Custom Order profile resolver marker not found')
          section = section.replace(old_profile, new_profile, 1)
          section = section.replace(
              "{% render 'product-capability-fields', capability_profile: capability_profile, product: catalog_product, section_id: item_key, surface_groups: option_surface_groups, show_intro: false, optional_label: optional_label %}",
              "{% render 'product-capability-fields', capability_profile: capability_profile, section_id: item_key, surface_groups: option_surface_groups, show_intro: false, optional_label: optional_label %}",
              1,
          )
          section = section.replace(
              "{% render 'custom-order-capability-profile', capability_profile: capability_profile, product: catalog_product %}",
              "{% render 'custom-order-capability-profile', capability_profile: capability_profile %}",
              1,
          )
          cards_marker = '          <div class="jill-custom-order__personalization-cards" data-jill-personalization-cards></div>\n'
          quantity_template = '''          <template data-jill-personalization-quantity-template>
            {% render 'ui-quantity', id: 'JillPersonalizationQuantityTemplate', name: blank, label: quantity_label, value: 0, min: 0, step: 1 %}
          </template>
'''
          if cards_marker not in section:
              raise SystemExit('Personalization cards marker not found')
          section = section.replace(cards_marker, quantity_template + cards_marker, 1)
          section_path.write_text(section)

          renderer_path = Path('theme/snippets/product-capability-fields.liquid')
          renderer = renderer_path.read_text()
          renderer_lookup = '''  if surface_groups != blank and product != blank
    for capability_collection in product.collections
      assign collection_capability_metafield = capability_collection.metafields.custom.jill_custom_order_capabilities
      if collection_capability_metafield != blank and collection_capability_metafield.type == 'json'
        assign capability_profile = collection_capability_metafield.value
        break
      endif
    endfor
  endif

'''
          if renderer_lookup not in renderer:
              raise SystemExit('Shared renderer Custom Order lookup not found')
          renderer_path.write_text(renderer.replace(renderer_lookup, '', 1))

          profile_path = Path('theme/snippets/custom-order-capability-profile.liquid')
          profile = profile_path.read_text()
          start = profile.index('{% comment %}')
          end = profile.index('%}', profile.index('{% endcomment %}')) + 2
          new_comment = '''{% comment %}
  Canonical Custom Order runtime projection.

  The Custom Order section resolves the effective capability profile once: a
  collection-owned Custom Order family profile first, then the product profile
  as fallback. This snippet only projects that resolved profile for runtime use.
  Order-level personalization and reference uploads stay outside Product Options.
{% endcomment %}'''
          profile = new_comment + profile[end:]
          lookup_start = profile.find('{% liquid\n  if product != blank')
          if lookup_start != -1:
              lookup_end = profile.find('%}', lookup_start) + 2
              profile = profile[:lookup_start] + profile[lookup_end:]
          profile_path.write_text(profile.lstrip())

          runtime_path = Path('theme/assets/jill-custom-order.js')
          runtime = runtime_path.read_text()
          function_start = runtime.index('  function createPersonalizationQuantityShell')
          function_end = runtime.index('  function renderPersonalization', function_start)
          old_function = runtime[function_start:function_end]
          new_function = '''  function createPersonalizationQuantityShell(root, state, group, item, groupIndex) {
    const row = node('div', 'jill-custom-order-personalization-card__allocation');
    row.dataset.jillPersonalizationAllocation = `${group.id}:${item.productId}`;

    const meta = node('div', 'jill-custom-order-personalization-card__allocation-meta');
    meta.append(
      node('strong', '', item.label),
      node('span', '', `${Math.max(0, Number(group.allocations[item.productId]) || 0)} / ${item.quantity} assigned`),
    );

    const template = root.querySelector('[data-jill-personalization-quantity-template]');
    const shell = template?.content.firstElementChild?.cloneNode(true);
    if (!shell || !globalThis.JILLQuantity) fail('personalization quantity template is unavailable');

    const current = Math.max(0, Number(group.allocations[item.productId]) || 0);
    const assignedElsewhere = personalizationAssignedForProduct(state, item.productId, group.id);
    const max = Math.max(0, item.quantity - assignedElsewhere);
    const input = globalThis.JILLQuantity.configure(shell, {
      id: `JillPersonalizationQuantity-${group.id}-${item.productId}`,
      label: 'Quantity',
      accessibleLabel: `${item.label}, Personalization ${groupIndex + 1}`,
      value: Math.min(current, max),
      min: 0,
      max,
      step: 1,
      required: false,
    });

    input.addEventListener('input', () => {
      const next = Math.max(0, Math.trunc(Number(input.value) || 0));
      if (next > 0) group.allocations[item.productId] = next;
      else delete group.allocations[item.productId];
      state.finished = false;
      syncPersonalizationActions(root);
      syncProgression(root);
    });
    input.addEventListener('change', () => {
      queueMicrotask(() => {
        renderPersonalization(root);
        syncProgression(root);
      });
    });

    row.append(meta, shell);
    return row;
  }

'''
          runtime_path.write_text(runtime[:function_start] + new_function + runtime[function_end:])

          test_path = Path('scripts/test-custom-order-integration.mjs')
          test = test_path.read_text()
          replacements = {
              "assert.match(section, /product: catalog_product/, 'Custom Order must give the shared renderer Shopify product context for collection-family projection');": "assert.match(section, /for capability_collection in catalog_product\\.collections/, 'Custom Order must resolve collection-owned family capabilities at the surface boundary');",
              "assert.match(section, /product: catalog_product %}/, 'runtime capability projection must receive the same Shopify product context as the renderer');": "assert.match(section, /if capability_profile == blank[\\s\\S]*jill_product_capabilities/, 'Custom Order family resolution must fall back to the canonical product capability profile');",
              "assert.match(customOrderProfile, /jill_custom_order_capabilities/, 'Custom Order capability projection must prefer collection-owned family capabilities');": "assert.doesNotMatch(customOrderProfile, /jill_custom_order_capabilities|product\\.collections/, 'runtime projection must not duplicate Custom Order family resolution');",
              "assert.match(renderer, /jill_custom_order_capabilities/, 'shared renderer must support collection-owned Custom Order family capabilities when product context is supplied');": "assert.doesNotMatch(renderer, /jill_custom_order_capabilities|product\\.collections/, 'shared capability renderer must remain unaware of Custom Order family resolution');",
              "assert.match(renderer, /for capability_collection in product\\.collections/, 'family capability lookup must be data-driven through Shopify collections');": "assert.match(section, /jill_custom_order_capabilities/, 'Custom Order family capability lookup must remain data-driven through Shopify collection metafields');",
          }
          for old, new in replacements.items():
              if old not in test:
                  raise SystemExit(f'Expected test marker not found: {old}')
              test = test.replace(old, new, 1)
          insert_after = "assert.match(section, /data-jill-personalization-finish/, 'personalization must keep an explicit finish milestone');\n"
          addition = "assert.match(section, /data-jill-personalization-quantity-template/, 'Different personalization must reuse the canonical quantity primitive through a Liquid template');\n"
          if insert_after not in test:
              raise SystemExit('Personalization finish assertion marker not found')
          if addition not in test:
              test = test.replace(insert_after, insert_after + addition, 1)
          runtime_anchor = "assert.match(runtime, /syncPersonalizationActions/, 'Finish and Add Another must share one live personalization action-state owner');\n"
          runtime_add = "assert.match(runtime, /data-jill-personalization-quantity-template/, 'dynamic personalization quantities must clone the canonical Liquid quantity template');\n"
          if runtime_anchor not in test:
              raise SystemExit('Runtime personalization action assertion not found')
          if runtime_add not in test:
              test = test.replace(runtime_anchor, runtime_anchor + runtime_add, 1)
          test_path.write_text(test)

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/sections/main-custom-order.liquid theme/snippets/product-capability-fields.liquid theme/snippets/custom-order-capability-profile.liquid theme/assets/jill-custom-order.js scripts/test-custom-order-integration.mjs
          git diff --cached --check
          git commit -m "Consolidate Section 4 capability and quantity ownership"
          git push origin HEAD:jill/custom-order-section4-system-pass
