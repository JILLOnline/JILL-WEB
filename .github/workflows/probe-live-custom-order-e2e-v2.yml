name: Probe Live Custom Order E2E V2

on:
  push:
    branches:
      - jill/live-custom-order-e2e
    paths:
      - .github/probe-live-custom-order-e2e-v2.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live endpoint, Rewards v13, submit, and idempotent retry
        shell: bash
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbxXruH-shyIEGbxIpyJtd4KrAMaN0J3Ov7icdae_MkMvig8I_Y_fm2OJ9cRJiZ-IzU7jA/exec
          SUBMISSION_ID: jill:backend-e2e-20260912-1024-a1
          TEST_EMAIL: info+backendtest-20260912-1024@jillonlinestore.com
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsSL "$ENDPOINT")"
          echo "HEALTH=$HEALTH"
          test "$HEALTH" = "JILL Custom Order Automation is online."
          WATCHDOG="$(curl -fsSL "$ENDPOINT?jill_rewards_watchdog=1")"
          echo "WATCHDOG=$WATCHDOG"
          echo "$WATCHDOG" | jq -e '.ok == true and .engine_version == "13"' >/dev/null
          PAYLOAD="$(jq -nc --arg id "$SUBMISSION_ID" --arg email "$TEST_EMAIL" '{source:"JILL custom order",submission_id:$id,submitted_at:"2026-09-12T14:24:00.000Z",name:"JILL Backend E2E Test",email:$email,phone:"",preferred_contact:"email",date_needed:"2026-09-30",fulfillment:"Jacksonville pickup",city:"",state:"",zip:"",theme:"Backend verification",colors:"JILL test",collections:"Piñatas",products:"1 × Piñata – 13 Inch",reference_images:"No",marketing_consent:"Yes",marketing_consent_at:"2026-09-12T14:24:00.000Z",marketing_consent_source:"backend_e2e_verification",raw_payload:"{\"version\":1,\"operation\":\"custom_order.submit\",\"submission_id\":\"jill:backend-e2e-20260912-1024-a1\",\"submitted_at\":\"2026-09-12T14:24:00.000Z\",\"customer\":{\"name\":\"JILL Backend E2E Test\",\"email\":\"info+backendtest-20260912-1024@jillonlinestore.com\",\"preferred_contact\":\"email\"},\"planning\":{\"date_needed\":\"2026-09-30\",\"fulfillment\":\"pickup\"},\"items\":[{\"item_id\":\"backend-e2e-item\",\"product_id\":\"backend-e2e\",\"title\":\"Piñata – 13 Inch\",\"collection_ids\":[\"pinatas\"],\"quantity\":1,\"attributes\":[{\"id\":\"opening_style\",\"label\":\"How should it open?\",\"value\":\"traditional\"}],\"personalization_groups\":[],\"reference_ids\":[]}],\"request_attributes\":[{\"id\":\"theme\",\"label\":\"Theme / character / style\",\"value\":\"Backend verification\"}],\"reference_ids\":[],\"marketing_consent\":{\"granted\":true,\"recorded_at\":\"2026-09-12T14:24:00.000Z\",\"source\":\"backend_e2e_verification\"}}"}')"
          FIRST="$(curl -fsSL -H 'Content-Type: application/json' --data "$PAYLOAD" "$ENDPOINT")"
          echo "FIRST=$FIRST"
          echo "$FIRST" | jq -e --arg id "$SUBMISSION_ID" '.version == 1 and .operation == "custom_order.submit.result" and .ok == true and .submission_id == $id and .duplicate == false and .status == "received"' >/dev/null
          SECOND="$(curl -fsSL -H 'Content-Type: application/json' --data "$PAYLOAD" "$ENDPOINT")"
          echo "SECOND=$SECOND"
          echo "$SECOND" | jq -e --arg id "$SUBMISSION_ID" '.version == 1 and .operation == "custom_order.submit.result" and .ok == true and .submission_id == $id and .duplicate == true and .status == "received"' >/dev/null
          echo "E2E_PROBE_OK submission_id=$SUBMISSION_ID email=$TEST_EMAIL"
