name: Sync JILL storefront theme

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jill-storefront-theme-sync
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot live storefront into Git
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}

    steps:
      - name: Checkout storefront branch
        uses: actions/checkout@v4
        with:
          ref: jill/storefront-system
          fetch-depth: 0

      - name: Read canonical storefront targets
        id: storefront
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('storefront.config.json', 'utf8'));
          console.log(`store=${config.store}`);
          console.log(`theme_id=${config.themes.source.id}`);
          console.log(`theme_path=${config.themePath}`);
          NODE

      - name: Require dedicated Shopify theme credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo "SHOPIFY_THEME_TOKEN is required." >&2
            echo "Use a Shopify Theme Access password or Admin API token authorized for theme files." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm install

      - name: Pull exact live JILL theme
        env:
          SHOPIFY_STORE: ${{ steps.storefront.outputs.store }}
          SHOPIFY_THEME_ID: ${{ steps.storefront.outputs.theme_id }}
          THEME_PATH: ${{ steps.storefront.outputs.theme_path }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$THEME_PATH"
          mkdir -p "$THEME_PATH"
          npx shopify theme pull \
            --store "$SHOPIFY_STORE" \
            --theme "$SHOPIFY_THEME_ID" \
            --path "$THEME_PATH" \
            --password "$SHOPIFY_CLI_THEME_TOKEN"

      - name: Verify complete Shopify theme structure
        env:
          THEME_PATH: ${{ steps.storefront.outputs.theme_path }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            layout/theme.liquid
            config/settings_schema.json
            config/settings_data.json
            templates/index.json
          )
          for path in "${required[@]}"; do
            test -f "$THEME_PATH/$path" || {
              echo "Theme snapshot is incomplete: missing $path" >&2
              exit 1
            }
          done

          for dir in assets blocks config layout locales sections snippets templates; do
            test -d "$THEME_PATH/$dir" || {
              echo "Theme snapshot is incomplete: missing $dir/" >&2
              exit 1
            }
          done

      - name: Run Shopify Theme Check
        env:
          THEME_PATH: ${{ steps.storefront.outputs.theme_path }}
        run: npx shopify theme check --path "$THEME_PATH"

      - name: Guard source-control hygiene
        env:
          THEME_PATH: ${{ steps.storefront.outputs.theme_path }}
        shell: bash
        run: |
          set -euo pipefail
          if find "$THEME_PATH" -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*token*' \) -print -quit | grep -q .; then
            echo "Refusing to commit a possible secret-bearing file." >&2
            exit 1
          fi
          if find "$THEME_PATH" -type d -name '.shopify' -print -quit | grep -q .; then
            echo "Refusing to commit Shopify CLI state." >&2
            exit 1
          fi

      - name: Commit exact storefront snapshot
        env:
          THEME_PATH: ${{ steps.storefront.outputs.theme_path }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JILL Storefront Bot'
          git config user.email 'info@jillonlinestore.com'
          git add --all "$THEME_PATH"

          if git diff --cached --quiet; then
            echo "Live storefront already matches the Git snapshot."
            exit 0
          fi

          git commit -m 'Snapshot live JILL storefront theme'
          git push origin HEAD:jill/storefront-system

# Source-control invariant:
# - MAIN theme is read-only input to this workflow.
# - Development/pushes target an unpublished theme in a separate workflow.
# - Theme source sync requires a dedicated SHOPIFY_THEME_TOKEN; app deployment
#   credentials are intentionally not accepted as a theme-access fallback.
