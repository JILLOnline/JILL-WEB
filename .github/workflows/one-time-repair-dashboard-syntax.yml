name: One-time dashboard syntax repair
on:
  push:
    paths:
      - '.github/workflows/one-time-repair-dashboard-syntax.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair dashboard reward pill syntax
        run: python -c "from pathlib import Path;import base64,functools;p=Path('extensions/jill-account-dashboard/src/Dashboard.jsx');s=p.read_text();pairs=[('e3Nsb3dSZXF1ZXN0ID8gJ1N0aWxsIGNyZWF0aW5n4oCmJyA6ICdDcmVhdGluZ+KApiJ9','e3Nsb3dSZXF1ZXN0ID8gJ1N0aWxsIGNyZWF0aW5n4oCmJyA6ICdDcmVhdGluZ+KApid9'),('ICAgICAgICAgIGFjY2Vzc2liaWxpdHlMYWJlbD17YFJlZGVlbSAke3RpZXIucG9pbnRzfSBwb2ludHMgZm9yICQke3RpZXIudmFsdWV9IE9GRn0K','ICAgICAgICAgIGFjY2Vzc2liaWxpdHlMYWJlbD17YFJlZGVlbSAke3RpZXIucG9pbnRzfSBwb2ludHMgZm9yICQke3RpZXIudmFsdWV9IE9GRmB9Cg=='),('dHlwZT17aXNBY2hpZXZlZCA/ICdjaGVjay1jaXJjbGUtZmlsbGVkJyA6IGlzTmV4dCA/ICdzdGFyLWZpbGxlZCcgOiAnY2lyY2xlJ30KICAgICAgICAgICAgICB0b25lPXtpc1JlZGVlbWVkID8gJ2luZm8nIDogaXNBY2hpZXZlZCA/ICdzdWNjZXNzJyA6IGlzTmV4dCA/ICdjdXN0b20nIDogJ25ldXRyYWwnfQ==','dHlwZT17aXNBY2hpZXZlZCA/ICdjaGVjay1jaXJjbGUtZmlsbGVkJyA6ICdjaXJjbGUnfQogICAgICAgICAgICAgIHRvbmU9e2lzQWNoaWV2ZWQgPyAnc3VjY2VzcycgOiBpc05leHQgPyAnaW5mbycgOiAnbmV1dHJhbCd9')];s=functools.reduce(lambda x,ab:x.replace(base64.b64decode(ab[0]).decode(),base64.b64decode(ab[1]).decode()),pairs,s);p.write_text(s)"
      - name: Commit repair
        run: |
          git config user.name "JILLOnline"
          git config user.email "info@jillonlinestore.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx
          git commit -m "Repair compact reward pill syntax"
          git push
