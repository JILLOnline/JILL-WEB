name: JILL HQ quote + catalog preflight preview

# New independent source-only CI. No release certificate changes; no
# Cloudflare Worker upload, Shopify Draft Order, Google, D1 or R2 writes.
on:
  push:
    branches:
      - jill/hq-quote-catalog-preflight-20261022
  pull_request:
    branches:
      - jill/rewards-work
    paths:
      - 'services/jill-order-desk/work-quote-catalog-preflight.mjs'
      - 'scripts/test-work-quote-catalog-preflight.mjs'
      - 'services/jill-order-desk/work-quote-owner-preflight.mjs'
      - 'scripts/test-work-hq-quote-owner-preflight.mjs'
      - 'services/jill-order-desk/app-home/app/routes/app.requests.quote-preflight.tsx'
      - 'services/jill-order-desk/app-home/app/routes.ts'
      - 'services/jill-order-desk/app-home/app/routes/app.requests-detail-source.server.ts'
      - 'services/jill-order-desk/app-home/app/routes/app.requests.$submissionId.tsx'
      - 'services/jill-order-desk/app-home/app/components/WorkQuoteWorksheet.tsx'
      - 'services/jill-order-desk/app-home/app/components/WorkQuoteOwnerPreflightPanel.tsx'
      - 'scripts/test-work-hq-quote-owner-ui.mjs'
      - 'services/jill-order-desk/work-quote-shopify-customer-bridge.mjs'
      - 'scripts/test-work-quote-shopify-customer-bridge.mjs'
      - 'services/jill-order-desk/work-google-owner-binding.mjs'
      - 'scripts/test-work-google-owner-binding.mjs'
      - 'backend/google-apps-script/JILL_WORK_HQ_OWNER_BINDING_QA_SOURCE.gs'
      - 'scripts/test-work-google-owner-ledger-qa.mjs'
      - 'docs/WORK_HQ_QUOTE_CATALOG_PREFLIGHT_20261022.md'
      - '.github/workflows/jill-hq-quote-catalog-preflight.yml'

permissions:
  contents: read

jobs:
  quote-preflight-offline:
    name: Verify original request, saved D1 draft model and Shopify Catalog source handoff (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure quote-stage orchestration and refusal cases
        run: |
          node scripts/test-work-quote-catalog-preflight.mjs
          node scripts/test-work-hq-quote-owner-preflight.mjs
          node scripts/test-work-hq-quote-owner-ui.mjs
          node scripts/test-work-quote-shopify-customer-bridge.mjs
          node scripts/test-work-google-owner-binding.mjs
          node scripts/test-work-google-owner-ledger-qa.mjs
      - name: Regress original saved-quote handoff and exact variant read security
        run: |
          node scripts/test-work-quote-commerce-handoff.mjs
          node scripts/test-work-hq-catalog-quote-bridge.mjs
          node scripts/test-work-quote-calculation.mjs
      - name: Install embedded WORK app dependencies for compile checks only
        run: npm install --prefix services/jill-order-desk/app-home --no-audit --no-fund
      - name: Typecheck real WORK embedded-app routes
        run: npm run typecheck --prefix services/jill-order-desk/app-home
      - name: Build real WORK embedded app without deployment
        run: npm run build --prefix services/jill-order-desk/app-home
      - name: No deploy/production script, only compiled pure Node source
        run: |
          node --check services/jill-order-desk/work-quote-catalog-preflight.mjs
          node --check scripts/test-work-quote-catalog-preflight.mjs
          node --check services/jill-order-desk/work-quote-owner-preflight.mjs
          node --check scripts/test-work-hq-quote-owner-preflight.mjs
          node --check scripts/test-work-hq-quote-owner-ui.mjs
          node --check services/jill-order-desk/work-quote-shopify-customer-bridge.mjs
          node --check scripts/test-work-quote-shopify-customer-bridge.mjs
          node --check services/jill-order-desk/work-google-owner-binding.mjs
          node --check scripts/test-work-google-owner-binding.mjs
          node --check scripts/test-work-google-owner-ledger-qa.mjs
