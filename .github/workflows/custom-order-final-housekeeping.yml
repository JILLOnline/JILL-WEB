name: Final Custom Order Backend Housekeeping

on:
  pull_request:
    branches:
      - jill/theme-core

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'jill/custom-order-email-pipeline'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove obsolete consent helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs')
          source = path.read_text()
          start = source.find('function booleanString_(value) {')
          if start == -1:
              raise SystemExit('booleanString_ definition not found')
          end_marker = '\n\nfunction isoDate_(value) {'
          end = source.find(end_marker, start)
          if end == -1:
              raise SystemExit('booleanString_ end boundary not found')
          source = source[:start] + source[end + 2:]
          if 'booleanString_(' in source:
              raise SystemExit('booleanString_ reference remains')
          path.write_text(source)

      - name: Validate backend guards
        run: |
          npm install --ignore-scripts
          node scripts/check-rewards-engine.mjs
          node scripts/test-rewards-engine.mjs
          node scripts/check-custom-order-contract.mjs
          node scripts/test-custom-order-integration.mjs
          git diff --check
          test -z "$(git diff --name-only -- theme)"

      - name: Remove temporary workflow and commit
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/custom-order-final-housekeeping.yml
          git config user.name 'JILL Backend Automation'
          git config user.email 'info@jillonlinestore.com'
          git add backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          git commit -m 'Remove obsolete Custom Order consent helper'
          git push origin "HEAD:${HEAD_BRANCH}"
