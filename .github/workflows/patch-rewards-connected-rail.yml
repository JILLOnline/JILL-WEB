name: Patch connected Rewards rail

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-rewards-connected-rail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect reward dots and tighten spacing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('extensions/jill-account-dashboard/src/Dashboard.jsx')
          text = path.read_text()

          text, count = re.subn(
              r'\nfunction RewardLiquidSegment\(\{points, from, to\}\) \{.*?\n\}\n\nfunction RewardsCard',
              '\nfunction RewardsCard',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('RewardLiquidSegment block was not found exactly once.')

          text, count = re.subn(
              r'\n        \{previousPoints > 0 && \(.*?\n        \)\}\n\n        <s-grid',
              '\n        <s-grid',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Old connector row was not found exactly once.')

          old_grid = '''        <s-grid
          gridTemplateColumns="44px minmax(0, 1fr)"
          gap="base"
          blockAlignment="center"
        >'''
          new_grid = '''        <s-grid
          gridTemplateColumns="28px minmax(0, 1fr)"
          gap="small-200"
          blockAlignment="start"
        >'''
          if old_grid not in text:
              raise SystemExit('Milestone grid was not found.')
          text = text.replace(old_grid, new_grid, 1)

          old_marker = '''          <s-stack direction="inline" justifyContent="center" alignItems="center">
            <s-icon
              type={isUnlocked ? 'check-circle-filled' : 'circle'}
              tone={isUnlocked ? 'success' : isNext ? 'info' : 'neutral'}
              size="small-200"
            />
          </s-stack>'''
          new_marker = '''          <s-stack direction="block" gap="none" alignItems="center">
            <s-icon
              type={isUnlocked ? 'check-circle-filled' : 'circle'}
              tone={isUnlocked ? 'success' : isNext ? 'info' : 'neutral'}
              size="small-200"
            />
            {showAllRewards && tier.points < REWARD_TIERS[REWARD_TIERS.length - 1].points && (
              <s-box inlineSize={2} blockSize={52} background="subdued" />
            )}
          </s-stack>'''
          if old_marker not in text:
              raise SystemExit('Milestone marker block was not found.')
          text = text.replace(old_marker, new_marker, 1)

          old_card = '''          <s-box
            padding="base"
            background={isUnlocked || isNext ? 'base' : 'subdued'}'''
          new_card = '''          <s-box
            padding="small-300"
            background={isUnlocked || isNext ? 'base' : 'subdued'}'''
          if old_card not in text:
              raise SystemExit('Reward card padding block was not found.')
          text = text.replace(old_card, new_card, 1)

          if '<s-stack direction="block" gap="small-300">' not in text:
              raise SystemExit('Reward card inner gap was not found.')
          text = text.replace(
              '<s-stack direction="block" gap="small-300">',
              '<s-stack direction="block" gap="small-200">',
              1,
          )

          old_expanded = '''              {showAllRewards && (
                <s-stack direction="block" gap="none">'''
          new_expanded = '''              {showAllRewards && (
                <s-stack direction="block" gap="small-100">'''
          if old_expanded not in text:
              raise SystemExit('Expanded rewards stack was not found.')
          text = text.replace(old_expanded, new_expanded, 1)

          old_main_gap = '''          <s-box padding="base" background="subdued" borderRadius="large" border="base base solid">
            <s-stack direction="block" gap="small-400">'''
          new_main_gap = '''          <s-box padding="base" background="subdued" borderRadius="large" border="base base solid">
            <s-stack direction="block" gap="small-300">'''
          if old_main_gap not in text:
              raise SystemExit('Rewards container gap was not found.')
          text = text.replace(old_main_gap, new_main_gap, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-rewards-connected-rail.yml
          git config user.name "JILL Rewards automation"
          git config user.email "info@jillonlinestore.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx .github/workflows/patch-rewards-connected-rail.yml
          git commit -m "Connect Rewards milestones and tighten spacing"
          git push origin HEAD:main
