name: Restore Custom Order request pipeline

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - '.github/workflows/restore-custom-order-request-pipeline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Core
        uses: actions/checkout@v4
        with:
          ref: jill/theme-core
          fetch-depth: 0

      - name: Apply request repair
        run: python scripts/restore-custom-order-request-pipeline.py

      - name: Validate request backend and repair
        shell: bash
        run: |
          set -euo pipefail
          node --check theme/assets/jill-custom-order.js
          node scripts/test-custom-order-integration.mjs
          endpoint='https://script.google.com/macros/s/AKfycbwjFDQxhjc4RDu8T0gSweQf70Y5TheTyWZ6KoVDux6Hx-Ue9jdE7E5Enl5nyxjJpo2W/exec'
          get_response="$(curl -L --fail --silent --show-error --max-time 60 "$endpoint")"
          printf '%s\n' "$get_response"
          printf '%s' "$get_response" | grep -Fq 'JILL Custom Order Automation is online.'
          post_response="$(curl -L --fail --silent --show-error --max-time 60 -X POST --data-urlencode 'source=JILL diagnostic' "$endpoint")"
          printf '%s\n' "$post_response"
          RESPONSE="$post_response" python -c "import json,os; data=json.loads(os.environ['RESPONSE']); assert data.get('ok') is False; assert data.get('error') == 'Invalid source'"

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-custom-order-request-pipeline.yml
          rm scripts/restore-custom-order-request-pipeline.py
          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add theme/sections/main-custom-order.liquid theme/assets/jill-custom-order.js scripts/test-custom-order-integration.mjs .github/workflows/restore-custom-order-request-pipeline.yml scripts/restore-custom-order-request-pipeline.py
          git diff --cached --check
          git commit -m 'Restore Custom Order request delivery pipeline'
          git push origin HEAD:jill/theme-core
