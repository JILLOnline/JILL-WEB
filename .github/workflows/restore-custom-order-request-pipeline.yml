name: Restore Custom Order request pipeline

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - '.github/workflows/restore-custom-order-request-pipeline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Core
        uses: actions/checkout@v4
        with:
          ref: jill/theme-core
          fetch-depth: 0

      - name: Apply request and LIVE-parity repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore-custom-order-request-pipeline.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-custom-order-integration.mjs')
          text = path.read_text()
          old = "assert.match(section, /dynamic_required: true/, 'conditionally required Phone must have a dynamic required marker');"
          new = "assert.match(section, /data-dynamic-required=\"true\"/, 'conditionally required Phone must have a dynamic required marker');"
          if old not in text:
              raise SystemExit('legacy phone-marker assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate repair and canonical backend
        shell: bash
        run: |
          set -euo pipefail
          node --check theme/assets/jill-custom-order.js
          node --check theme/assets/jill-email-validation.js
          node scripts/test-custom-order-integration.mjs
          endpoint='https://script.google.com/macros/s/AKfycbwjFDQxhjc4RDu8T0gSweQf70Y5TheTyWZ6KoVDux6Hx-Ue9jdE7E5Enl5nyxjJpo2W/exec'
          get_response="$(curl -L --fail --silent --show-error --max-time 60 "$endpoint")"
          printf '%s\n' "$get_response"
          printf '%s' "$get_response" | grep -Fq 'JILL Custom Order Automation is online.'

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-custom-order-request-pipeline.yml
          rm scripts/restore-custom-order-request-pipeline.py
          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add theme/sections/main-custom-order.liquid theme/assets/jill-custom-order.js theme/assets/jill-email-validation.js theme/assets/jill-forms.css theme/layout/theme.liquid scripts/test-custom-order-integration.mjs .github/workflows/restore-custom-order-request-pipeline.yml scripts/restore-custom-order-request-pipeline.py
          git diff --cached --check
          git commit -m 'Restore Custom Order delivery and LIVE parity'
          git push origin HEAD:jill/theme-core
