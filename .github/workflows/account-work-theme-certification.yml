name: ACCOUNT Shopify WORK theme certification

on:
  push:
    branches:
      - ACCOUNT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-work-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify account theme root and WORK-specific isolation
        run: node scripts/check-account-theme-root.mjs
      - name: Certify WORK Custom Order root and editor preview
        run: node scripts/test-account-work-custom-order-preview.mjs
      - name: Exercise WORK reference uploads and reversible Yes/No logic
        run: node scripts/test-account-custom-order-reference-flow.mjs
      - name: Verify pending upload spinner and confirmed compact thumbnails
        run: node scripts/test-account-custom-order-media-render.mjs
      - name: Audit required Shopify Liquid, JS and CSS dependencies
        run: node scripts/audit-theme-dependencies.mjs .
      - name: Shopify Theme Check (Liquid, schema, theme assets)
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
      - name: Verify source tree stays unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"

  validate-account-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Certify My JILL account and coupons boundaries
        run: |
          node scripts/test-account-hub-canary.mjs
          node scripts/test-account-rewards-readiness.mjs
          node scripts/test-account-coupons.mjs
          node scripts/test-customer-coupons.mjs
      - name: Certify WORK Custom Order session and app-proxy routing
        run: |
          node scripts/test-custom-order-account-session.mjs
          node scripts/test-custom-order-work-proxy-config.mjs
      - name: Certify Custom Order WORK gateway and customer ownership
        run: |
          node scripts/test-custom-order-gateway.mjs
          node scripts/test-custom-order-account-read.mjs
          node scripts/test-custom-order-work-proxy.mjs
      - name: Certify points and redemption logic without Shopify writes
        run: |
          node scripts/test-rewards-engine.mjs
          node scripts/test-rewards-redemption.mjs
