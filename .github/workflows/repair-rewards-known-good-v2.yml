name: Restore Rewards known-good transport v2

on:
  push:
    branches:
      - jill/rewards-known-good-transport
    paths:
      - .github/workflows/repair-rewards-known-good-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/rewards-known-good-transport
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply known-good transport
        run: python .github/repair_rewards_known_good.py
      - name: Validate repository
        run: npm install
      - name: Commit repair
        run: |
          git config user.name JILLOnline
          git config user.email info@jillonlinestore.com
          git add extensions/jill-account-dashboard/src/Dashboard.jsx scripts/test-rewards-redemption.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m "Restore known-good Rewards request transport"
          git push origin HEAD:jill/rewards-known-good-transport
