name: Probe Coupons V2 Shopify UID

on:
  push:
    branches:
      - jill/coupons-v2-recovery
    paths:
      - 'extensions/jill-account-coupons-v2/**'
      - '.github/workflows/probe-coupons-v2-uid.yml'

jobs:
  probe:
    name: Create unreleased Shopify version and capture UIDs
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLIENT_ID: ebf1a69d82f46619d2f2945faab78afa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Link JILL Custom Form app configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: >-
          npx shopify app config link
          --client-id "$SHOPIFY_CLIENT_ID"
          --file-name production
          --force

      - name: Preserve current scopes
        run: node scripts/merge-shopify-scopes.mjs shopify.app.production.toml

      - name: Validate configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npx shopify app config validate --config production

      - name: Create unreleased app version only
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: >-
          npx shopify app deploy
          --config production
          --no-release
          --source-control-url "$COMMIT_URL"

      - name: Show Shopify-managed extension UIDs
        shell: bash
        run: |
          echo '--- Dashboard ---'
          cat extensions/jill-account-dashboard/shopify.extension.toml
          echo '--- Coupons old ---'
          cat extensions/jill-account-coupons/shopify.extension.toml
          echo '--- Coupons V2 ---'
          cat extensions/jill-account-coupons-v2/shopify.extension.toml
          echo '--- Profile block ---'
          cat extensions/jill-account-home/shopify.extension.toml
          echo '--- UID diff generated by Shopify CLI ---'
          git diff -- extensions/*/shopify.extension.toml || true
