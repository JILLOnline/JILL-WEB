name: Package JILL Theme Core

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - 'theme/**'
      - '.github/workflows/package-theme-core.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-jill-theme-core
  cancel-in-progress: true

jobs:
  package:
    name: Package certified Shopify theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build root-level Shopify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          zip -q -r ../jill-theme-core.zip \
            assets \
            config \
            layout \
            locales \
            sections \
            snippets \
            templates
          cd ..
          test -s jill-theme-core.zip
          unzip -Z1 jill-theme-core.zip | grep -qx 'layout/theme.liquid'
          unzip -Z1 jill-theme-core.zip | grep -qx 'config/settings_schema.json'
          if unzip -Z1 jill-theme-core.zip | grep -Eq '^theme/|^\.theme-check\.yml$'; then
            echo 'Package contains a forbidden wrapper/tooling path.' >&2
            exit 1
          fi

      - name: Publish deployment artifact branch
        shell: bash
        env:
          ARTIFACT_BRANCH: jill/theme-core-artifacts
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          mv jill-theme-core.zip "$artifact_dir/jill-theme-core.zip"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/source-commit.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin "$ARTIFACT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ARTIFACT_BRANCH:$ARTIFACT_BRANCH"
            git switch "$ARTIFACT_BRANCH"
          else
            git switch --orphan "$ARTIFACT_BRANCH"
          fi

          git rm -rf . || true
          cp "$artifact_dir/jill-theme-core.zip" ./jill-theme-core.zip
          cp "$artifact_dir/source-commit.txt" ./source-commit.txt
          git add jill-theme-core.zip source-commit.txt
          git commit -m "Package Theme Core $GITHUB_SHA"
          git push origin "$ARTIFACT_BRANCH"
