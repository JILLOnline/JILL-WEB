name: One-time Custom Order review visibility repair

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - .github/workflows/fix-custom-order-review-leak.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/theme-core
          fetch-depth: 0

      - name: Repair Review hidden-state ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('theme/assets/jill-forms.css')
          css = css_path.read_text()
          before = """  .jill-custom-order[data-jill-custom-order] .jill-custom-order__review {\n    display: grid;\n    width: 100%;\n"""
          after = """  .jill-custom-order[data-jill-custom-order] .jill-custom-order__review {\n    width: 100%;\n"""
          if before not in css:
              raise SystemExit('Expected leaking Review display declaration was not found')
          if css.count(before) != 1:
              raise SystemExit('Expected exactly one leaking Review display declaration')
          css_path.write_text(css.replace(before, after, 1))

          test_path = Path('scripts/test-custom-order-integration.mjs')
          test = test_path.read_text()
          anchor = "assert.match(section, /data-jill-custom-order-review/, 'Custom Order must expose a dedicated Review destination');\n"
          guard = """assert.match(section, /data-jill-custom-order-review hidden aria-hidden=\"true\"/, 'Review must be server-rendered hidden before the runtime explicitly opens it');\nassert.doesNotMatch(formsCss, /\\.jill-custom-order\\[data-jill-custom-order\\] \\.jill-custom-order__review\\s*\\{[^}]*\\bdisplay\\s*:/s, 'Review layout CSS must not override the canonical hidden-state owner');\n"""
          if guard not in test:
              if anchor not in test:
                  raise SystemExit('Review integration assertion anchor was not found')
              test = test.replace(anchor, anchor + guard, 1)
              test_path.write_text(test)
          PY

      - name: Validate repair
        shell: bash
        run: |
          node scripts/test-custom-order-integration.mjs
          node --check theme/assets/jill-custom-order.js
          if grep -RIn --include='*.css' '!important' theme/assets/jill-forms.css; then
            echo 'Unexpected !important in canonical form CSS'
            exit 1
          fi

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-custom-order-review-leak.yml
          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add theme/assets/jill-forms.css scripts/test-custom-order-integration.mjs .github/workflows/fix-custom-order-review-leak.yml
          git diff --cached --check
          git commit -m 'Fix Custom Order review visibility leak'
          git push origin HEAD:jill/theme-core
