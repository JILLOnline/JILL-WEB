name: One-time reward color patch

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-reward-colors.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reward status color patch
        run: node scripts/patch-reward-colors.mjs

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- extensions/jill-account-dashboard/src/Dashboard.jsx; then
            echo "No reward color patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx
          git commit -m "Fix reward status colors"
          git push
