name: Finalize Custom Order Backend

on:
  push:
    branches:
      - jill/custom-order-backend-finalize
    paths:
      - .github/finalize-custom-order-backend.trigger

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/custom-order-backend-finalize
          fetch-depth: 0

      - name: Apply canonical sheet and Shopify schema fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs')
          text = path.read_text(encoding='utf-8')

          if "SHEET_ID: '1xVG4Jvh-vLB6BH5QitNcLQuaLj6DkXeSlFHg_LkECT8'" not in text:
              needle = "  SHEET_NAME: 'Submissions',\n"
              if needle not in text:
                  raise SystemExit('Could not locate JILL.SHEET_NAME')
              text = text.replace(
                  needle,
                  needle + "  SHEET_ID: '1xVG4Jvh-vLB6BH5QitNcLQuaLj6DkXeSlFHg_LkECT8',\n",
                  1,
              )

          setup_start = text.index('function setupJill() {')
          web_marker = text.index('/* ---------------------------\n   WEB APP', setup_start)
          setup_replacement = '''function setupJill() {
            const ss = SpreadsheetApp.openById(JILL.SHEET_ID);
            let sheet = ss.getSheetByName(JILL.SHEET_NAME);

            if (!sheet) {
              sheet = ss.insertSheet(JILL.SHEET_NAME);
              sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]);
              sheet.setFrozenRows(1);
            }

            ensureHeaders_(sheet);

            const url = 'https://docs.google.com/spreadsheets/d/' + JILL.SHEET_ID;
            Logger.log('JILL lead sheet: ' + url);
            return url;
          }


          '''
          text = text[:setup_start] + setup_replacement + text[web_marker:]

          get_start = text.index('function getSheet_() {')
          save_start = text.index('function saveSubmission_(sheet, data) {', get_start)
          get_replacement = '''function getSheet_() {
            const ss = SpreadsheetApp.openById(JILL.SHEET_ID);
            let sheet = ss.getSheetByName(JILL.SHEET_NAME);

            if (!sheet) {
              sheet = ss.insertSheet(JILL.SHEET_NAME);
              sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]);
              sheet.setFrozenRows(1);
            }

            ensureHeaders_(sheet);
            return sheet;
          }

          '''
          text = text[:get_start] + get_replacement + text[save_start:]

          build_start = text.index('function buildCustomerMetafields_(ownerId, data) {')
          subscribe_start = text.index('function subscribeEmailMarketing_(customerId, consentAt) {', build_start)
          build_replacement = '''function buildCustomerMetafields_(ownerId, data) {
            const metafields = [];

            function addText(key, value) {
              value = clean_(value);
              if (!value) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'single_line_text_field',
                value: value.replace(/\\s+/g, ' ').trim()
              });
            }

            function addLongText(key, value) {
              value = clean_(value);
              if (!value) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'multi_line_text_field',
                value: value
              });
            }

            function addDate(key, value) {
              value = clean_(value);
              if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'date',
                value: value
              });
            }

            function addDateTime(key, value) {
              value = clean_(value);
              if (!value) return;

              const parsed = new Date(value);
              if (isNaN(parsed.getTime())) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'date_time',
                value: parsed.toISOString()
              });
            }

            addDateTime(
              'last_custom_request_at',
              data.submitted_at || new Date().toISOString()
            );
            addText('last_custom_request_id', data.submission_id);
            addText('custom_request_status', 'Received');
            addText('preferred_contact', data.preferred_contact);
            addDate('date_needed', data.date_needed);
            addText('fulfillment_preference', data.fulfillment);
            addText('city', data.city);
            addText('state', data.state);
            addText('zip', data.zip);
            addText('submitted_phone', data.phone);
            addLongText('theme_interest', data.theme);
            addLongText('color_preferences', data.colors);
            addLongText('product_interests', data.products);
            addLongText('collection_interests', data.collections);
            addText('reference_images', data.reference_images);

            if (marketingConsentGranted_(data.marketing_consent)) {
              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: 'annual_reminder_enabled',
                type: 'boolean',
                value: 'true'
              });

              addText(
                'marketing_consent_source',
                data.marketing_consent_source || 'Custom Order Form'
              );

              addDateTime(
                'marketing_consent_at',
                data.marketing_consent_at || data.submitted_at || new Date().toISOString()
              );
            }

            return metafields;
          }

          '''
          text = text[:build_start] + build_replacement + text[subscribe_start:]
          path.write_text(text, encoding='utf-8')

      - name: Verify canonical ownership
        shell: bash
        run: |
          set -euo pipefail
          FILE=backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          grep -q "SHEET_ID: '1xVG4Jvh-vLB6BH5QitNcLQuaLj6DkXeSlFHg_LkECT8'" "$FILE"
          ! grep -q "props.getProperty('JILL_SHEET_ID')" "$FILE"
          ! grep -q "SpreadsheetApp.create('JILL Custom Order Leads')" "$FILE"
          grep -q "last_custom_request_at" "$FILE"
          grep -q "fulfillment_preference" "$FILE"
          grep -q "theme_interest" "$FILE"
          grep -q "product_interests" "$FILE"
          grep -q "marketingOptInLevel: 'SINGLE_OPT_IN'" "$FILE"
          grep -q "const JILL_REWARDS_ENGINE_VERSION = '13'" "$FILE"
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs')
          t = p.read_text()
          block = t.split('function buildCustomerMetafields_(ownerId, data) {', 1)[1].split('function subscribeEmailMarketing_', 1)[0]
          if 'event_date' in block:
              raise SystemExit('Event Date was reintroduced into Shopify metafields')
          old_keys = ["'request_status'", "'last_request_id'", "'request_submitted_at'", "'fulfillment'", "'theme'", "'colors'", "'collections'", "'products'", "'phone'", "'marketing_consent'"]
          found = [x for x in old_keys if x in block]
          if found:
              raise SystemExit('Obsolete Shopify metafield keys remain: ' + ', '.join(found))
          PY

      - name: Run backend guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-rewards-engine.mjs backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          node scripts/test-rewards-engine.mjs backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          node scripts/check-custom-order-contract.mjs
          node scripts/test-custom-order-integration.mjs
          git diff --check

      - name: Verify backend-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort
          git diff --name-only | grep -qx 'backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs'
          test "$(git diff --name-only | wc -l)" -eq 1

      - name: Commit backend patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          git commit -m "Finalize Custom Order Apps Script backend"
          git rm .github/workflows/finalize-custom-order-backend.yml .github/finalize-custom-order-backend.trigger
          git commit -m "Remove temporary backend finalization workflow"
          git push origin HEAD:jill/custom-order-backend-finalize
