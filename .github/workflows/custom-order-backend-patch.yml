name: Apply Custom Order Backend Patch

on:
  pull_request:
    branches:
      - jill/theme-core

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'jill/custom-order-email-pipeline'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical backend patch
        run: node scripts/apply-custom-order-email-pipeline.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Parse Apps Script and run Rewards v13 guard
        run: node scripts/check-rewards-engine.mjs

      - name: Run Rewards v13 tests
        run: node scripts/test-rewards-engine.mjs

      - name: Run Custom Order contract guard
        run: node scripts/check-custom-order-contract.mjs

      - name: Run Custom Order integration tests
        run: node scripts/test-custom-order-integration.mjs

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only -- theme)"
          test "$(git diff --name-only -- backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs | wc -l)" -eq 1

      - name: Commit backend patch to PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs; then
            echo 'Backend already contains the canonical patch.'
            exit 0
          fi
          git config user.name 'JILL Backend Automation'
          git config user.email 'info@jillonlinestore.com'
          git add backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          git commit -m 'Fix Custom Order email pipeline'
          git push origin "HEAD:${HEAD_BRANCH}"
