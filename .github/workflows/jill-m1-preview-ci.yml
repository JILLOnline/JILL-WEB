name: JILL M1 source-only preview checks

# Isolated PR compile verification. Never deploy, publish, mutate a store,
# read secrets, or bypass WORK release gates.
on:
  pull_request:
    branches:
      - jill/rewards-work
    paths:
      - 'shared/work-hq-focus-queue.mjs'
      - 'services/jill-order-desk/app-home/**'
      - 'scripts/test-work-hq-focus-queue-preview.mjs'
      - 'services/jill-order-desk/work-quote-unit-price-review.mjs'
      - 'scripts/test-work-hq-quote-unit-price-preview.mjs'
      - 'services/jill-order-desk/work-quote-unit-line-plan.mjs'
      - 'services/jill-order-desk/work-quote-catalog-review.mjs'
      - 'services/jill-order-desk/work-quote-catalog-comparison.mjs'
      - 'scripts/test-work-hq-quote-catalog-review.mjs'
      - 'scripts/test-work-hq-quote-catalog-comparison.mjs'
      - 'scripts/test-work-hq-quote-draft-roundtrip-preview.mjs'
      - 'scripts/test-work-hq-quote-http-lifecycle-preview.mjs'
      - 'scripts/test-work-hq-quote-artwork-audit.mjs'
      - 'services/jill-order-desk/work-quote-artwork-audit.mjs'
      - 'services/jill-order-desk/work-quote-per-unit-calculation-preview.mjs'
      - 'scripts/test-work-hq-per-unit-shopify-calculation-preview.mjs'
      - 'services/jill-order-desk/work-quote-per-unit-authorized-preview.mjs'
      - 'scripts/test-work-hq-per-unit-shopify-authorized-preview.mjs'
      - 'scripts/test-work-hq-m1-m2-predeploy-guard.mjs'
      - '.github/workflows/jill-m1-preview-ci.yml'
      - 'scripts/certify-work-hq-m1-m2-source-edition.mjs'
      - 'scripts/test-work-hq-m1-m2-source-edition.mjs'
      - 'scripts/work-hq-m1-m2-source-edition.json'

permissions:
  contents: read

jobs:
  source-preview:
    name: Validate read-only Operations Queue and compile embedded WORK app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Source lock requires the exact immutable WORK ancestor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new M1/M2 source-edition certificate and protected V4 baseline (no deploy)
        run: node scripts/test-work-hq-m1-m2-source-edition.mjs
      - name: Validate pure source and negative tests
        run: node scripts/test-work-hq-focus-queue-preview.mjs
      - name: Verify M2 per-unit price review and source boundaries
        run: node scripts/test-work-hq-quote-unit-price-preview.mjs
      - name: Verify M2 signed-source catalog read and OFF gates
        run: node scripts/test-work-hq-quote-catalog-review.mjs
      - name: Verify M2 price comparison, private terms and stale snapshots
        run: node scripts/test-work-hq-quote-catalog-comparison.mjs
      - name: Regress existing Quote Worksheet, P1/P2, Catalog bridge and native handoff (no writes)
        run: |
          npm run test:work-hq-quote-worksheet
          npm run test:work-hq-quote-unit-review
          npm run test:work-hq-catalog-quote-bridge
          npm run test:work-quote-commerce-handoff
          npm run test:work-hq-quote-ui-wiring
      - name: Verify M2 draft write-plan, hash, restored projection, no-PII and OFF endpoints
        run: node scripts/test-work-hq-quote-draft-roundtrip-preview.mjs
      - name: Verify M2 Owner HTTP Save/Reload, idempotency and tamper recovery (synthetic D1 only)
        run: node scripts/test-work-hq-quote-http-lifecycle-preview.mjs
      - name: Verify M2 artwork source counts, privacy, and no provider access
        run: node scripts/test-work-hq-quote-artwork-audit.mjs
      - name: Verify repeated ProductVariant P1/P2 calculation and fail-closed results (synthetic only)
        run: node scripts/test-work-hq-per-unit-shopify-calculation-preview.mjs
      - name: Verify M2 Owner-only Shopify SDK calculation boundary (synthetic backend)
        run: node scripts/test-work-hq-per-unit-shopify-authorized-preview.mjs
      - name: Verify My JILL customer ownership, public messaging and account continuity (source-only)
        run: |
          npm run test:custom-order-ownership
          npm run test:custom-order-account-read
          npm run test:customer-custom-orders
          npm run test:work-message-inboxes
          npm run test:account-hub-canary
      - name: Verify M1 + M2 WORK predeploy feature and route safety
        run: node scripts/test-work-hq-m1-m2-predeploy-guard.mjs
      - name: Install isolated WORK App Home (no deploy)
        run: npm install --prefix services/jill-order-desk/app-home --no-audit --no-fund
      - name: Typecheck actual embedded app
        run: npm run typecheck --prefix services/jill-order-desk/app-home
      - name: Build actual embedded WORK app (no deploy)
        run: npm run build --prefix services/jill-order-desk/app-home
      - name: Verify compiled M1/M2 WORK Worker itself, local D1, disabled finance and OAuth (NO DEPLOY)
        working-directory: services/jill-order-desk/app-home
        run: node scripts/test-workerd-m1m2-compiled-local.mjs

