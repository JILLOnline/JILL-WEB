name: Patch centered rewards toggle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-center-rewards-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Center rewards toggle and remove arrows
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('extensions/jill-account-dashboard/src/Dashboard.jsx')
          text = path.read_text()

          pattern = re.compile(
              r'(?P<indent>\s*)<s-button\s+variant="secondary"\s+onClick=\{\(\) => setShowAllRewards\(\(current\) => !current\)\}\s*>\s*\{showAllRewards \? \'Collapse rewards ↑\' : \'View all rewards ↓\'\}\s*</s-button>',
              re.S,
          )

          match = pattern.search(text)
          if not match:
            raise SystemExit('Rewards toggle block not found.')

          indent = match.group('indent')
          replacement = (
              f'{indent}<s-stack direction="inline" justifyContent="center">\n'
              f'{indent}  <s-button\n'
              f'{indent}    variant="secondary"\n'
              f'{indent}    onClick={{() => setShowAllRewards((current) => !current)}}\n'
              f'{indent}  >\n'
              f"{indent}    {{showAllRewards ? 'Collapse rewards' : 'View all rewards'}}\n"
              f'{indent}  </s-button>\n'
              f'{indent}</s-stack>'
          )

          path.write_text(pattern.sub(replacement, text, count=1))
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-center-rewards-toggle.yml
          git config user.name "JILL Rewards automation"
          git config user.email "info@jillonlinestore.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx .github/workflows/patch-center-rewards-toggle.yml
          git commit -m "Center rewards toggle and remove arrows"
          git push origin HEAD:main
