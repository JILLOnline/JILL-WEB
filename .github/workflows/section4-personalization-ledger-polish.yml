name: Section 4 Personalization Ledger Polish

on:
  push:
    branches:
      - jill/section4-personalization-ledger-polish

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/section4-personalization-ledger-polish
          fetch-depth: 0
      - name: Apply personalization ledger and visual polish
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/assets/jill-custom-order.js theme/assets/jill-forms.css theme/sections/main-custom-order.liquid scripts/test-custom-order-integration.mjs
          git diff --cached --check
          git commit -m "Polish Section 4 personalization ledger"
          git push origin HEAD:jill/section4-personalization-ledger-polish
