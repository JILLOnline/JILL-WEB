name: Consolidate Custom Order Review CSS

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - .github/workflows/fix-custom-order-review-css.yml
      - scripts/fix-custom-order-review-css.py

permissions:
  contents: write

jobs:
  fix-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: jill/theme-core

      - name: Consolidate Review CSS ownership
        run: python3 scripts/fix-custom-order-review-css.py

      - name: Run full repository guard suite
        run: npm install

      - name: Verify touched-path hard rules
        run: |
          set -euo pipefail
          node --check theme/assets/jill-custom-order.js
          ! grep -R "!important" theme/assets/jill-forms.css theme/assets/jill-custom-order.js theme/sections/main-custom-order.liquid
          ! grep -R "MutationObserver" theme/assets/jill-custom-order.js

      - name: Remove one-time fix and commit canonical source
        run: |
          set -euo pipefail
          rm -f scripts/fix-custom-order-review-css.py .github/workflows/fix-custom-order-review-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate Custom Order Review CSS ownership"
          git push origin HEAD:jill/theme-core
