name: Fix Custom Order Shopify Schema

on:
  push:
    branches:
      - jill/custom-order-email-pipeline
    paths:
      - .github/fix-custom-order-shopify-schema.trigger

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/custom-order-email-pipeline
          fetch-depth: 0

      - name: Restore canonical production Shopify metafield schema
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r"function buildCustomerMetafields_\(ownerId, data\) \{.*?\n\}\n\nfunction subscribeEmailMarketing_", re.S)

          replacement = r'''function buildCustomerMetafields_(ownerId, data) {
            const metafields = [];

            function addText(key, value) {
              value = clean_(value);
              if (!value) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'single_line_text_field',
                value: value.replace(/\s+/g, ' ').trim()
              });
            }

            function addLongText(key, value) {
              value = clean_(value);
              if (!value) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'multi_line_text_field',
                value: value
              });
            }

            function addDate(key, value) {
              value = clean_(value);
              if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'date',
                value: value
              });
            }

            function addDateTime(key, value) {
              value = clean_(value);
              if (!value) return;

              const parsed = new Date(value);
              if (isNaN(parsed.getTime())) return;

              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: key,
                type: 'date_time',
                value: parsed.toISOString()
              });
            }

            addDateTime(
              'last_custom_request_at',
              data.submitted_at || new Date().toISOString()
            );
            addText('last_custom_request_id', data.submission_id);
            addText('custom_request_status', 'Received');
            addText('preferred_contact', data.preferred_contact);
            addDate('date_needed', data.date_needed);
            addText('fulfillment_preference', data.fulfillment);
            addText('city', data.city);
            addText('state', data.state);
            addText('zip', data.zip);
            addText('submitted_phone', data.phone);
            addLongText('theme_interest', data.theme);
            addLongText('color_preferences', data.colors);
            addLongText('product_interests', data.products);
            addLongText('collection_interests', data.collections);
            addText('reference_images', data.reference_images);

            if (marketingConsentGranted_(data.marketing_consent)) {
              metafields.push({
                ownerId: ownerId,
                namespace: 'jill',
                key: 'annual_reminder_enabled',
                type: 'boolean',
                value: 'true'
              });

              addText(
                'marketing_consent_source',
                data.marketing_consent_source || 'Custom Order Form'
              );

              addDateTime(
                'marketing_consent_at',
                data.marketing_consent_at || data.submitted_at || new Date().toISOString()
              );
            }

            return metafields;
          }

          function subscribeEmailMarketing_'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'Expected one buildCustomerMetafields_ block, replaced {count}')

          path.write_text(updated, encoding='utf-8')

      - name: Verify no Event Date regression
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs').read_text()
          block = text.split('function buildCustomerMetafields_(ownerId, data) {',1)[1].split('function subscribeEmailMarketing_',1)[0]
          if "addDate('event_date'" in block or "['event_date'" in block:
              raise SystemExit('Event Date was reintroduced into Shopify sync')
          required = [
              'last_custom_request_at','last_custom_request_id','custom_request_status',
              'preferred_contact','date_needed','fulfillment_preference','city','state','zip',
              'submitted_phone','theme_interest','color_preferences','product_interests',
              'collection_interests','reference_images','annual_reminder_enabled',
              'marketing_consent_source','marketing_consent_at'
          ]
          missing = [key for key in required if key not in block]
          if missing:
              raise SystemExit('Missing canonical metafield keys: ' + ', '.join(missing))
          PY

      - name: Run backend guards
        run: |
          set -euo pipefail
          node scripts/check-rewards-engine.mjs backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          node scripts/test-rewards-engine.mjs backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          node scripts/check-custom-order-contract.mjs
          node scripts/test-custom-order-integration.mjs
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          git commit -m "Restore canonical Custom Order Shopify metafields"
          git rm .github/workflows/fix-custom-order-shopify-schema.yml .github/fix-custom-order-shopify-schema.trigger
          git commit -m "Remove temporary Shopify schema patch workflow"
          git push origin HEAD:jill/custom-order-email-pipeline
