name: JILL HQ WORK catalog inventory truth source QA
# Ephemeral checkout + no provider credentials. Never deploy or change stock.
on:
  push:
    branches:
      - jill/hq-catalog-stock-truth-20261026
      - jill/hq-request-detail-recovery-20261026
      - jill/hq-inbox-item-preview-20261026
      - jill/hq-bounded-request-prefetch-20261026
      - jill/hq-prefetch-lease-guard-20261026
      - jill/hq-quote-reload-revision-guard-20261026
      - jill/hq-quote-recovery-guidance-20261026
      - jill/hq-quote-response-once-20261026
      - jill/hq-quote-save-single-flight-20261027
  pull_request:
    branches:
      - jill/hq-visual-polish-source-20261024
      - jill/hq-catalog-stock-truth-20261026
      - jill/hq-request-detail-recovery-20261026
      - jill/hq-inbox-item-preview-20261026
      - jill/hq-bounded-request-prefetch-20261026
      - jill/hq-prefetch-lease-guard-20261026
      - jill/hq-quote-reload-revision-guard-20261026
      - jill/hq-quote-recovery-guidance-20261026
      - jill/hq-quote-response-once-20261026
    paths:
      - 'services/jill-order-desk/work-catalog-stock-label.mjs'
      - 'services/jill-order-desk/app-home/app/routes/app.catalog.tsx'
      - 'scripts/test-work-catalog-stock-label.mjs'
      - 'scripts/test-work-hq-request-detail-recovery.mjs'
      - 'scripts/test-work-hq-inbox-item-preview.mjs'
      - 'scripts/test-work-hq-bounded-detail-prefetch.mjs'
      - 'scripts/test-work-quote-reload-revision-guard.mjs'
      - 'scripts/test-work-quote-recovery-guidance.mjs'
      - 'scripts/test-work-quote-response-once.mjs'
      - 'scripts/test-work-quote-save-single-flight.mjs'
      - 'scripts/test-work-quote-recovery-mounted.mjs'
      - 'scripts/fixtures/work-quote-recovery-browser.mjs'
      - 'services/jill-order-desk/work-quote-draft-read.mjs'
      - 'services/jill-order-desk/work-quote-save-boundary.mjs'
      - 'services/jill-order-desk/work-quote-ui-payload.mjs'
      - '**/package-lock.json'
      - 'services/jill-order-desk/work-quote-save-flight.mjs'
      - 'services/jill-order-desk/work-quote-recovery-guidance.mjs'
      - 'services/jill-order-desk/work-quote-readback-policy.mjs'
      - 'services/jill-order-desk/app-home/app/components/WorkQuoteWorksheet.tsx'
      - 'services/jill-order-desk/work-request-name-prefetch.mjs'
      - 'services/jill-order-desk/app-home/app/components/WorkOriginalRequestDetails.tsx'
      - 'services/jill-order-desk/app-home/app/routes/app.requests.tsx'
      - '.github/workflows/jill-hq-catalog-stock-truth-preview.yml'
permissions:
  contents: read
jobs:
  truthful-catalog-source:
    name: Verify product stock wording and compile authenticated HQ UI without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Verify exact inventory label policy and unchanged source access
        run: |
          node scripts/test-work-catalog-stock-label.mjs
          node scripts/test-work-hq-request-detail-recovery.mjs
          node scripts/test-work-hq-inbox-item-preview.mjs
          node scripts/test-work-hq-bounded-detail-prefetch.mjs
          node scripts/test-work-quote-reload-revision-guard.mjs
          node scripts/test-work-quote-recovery-guidance.mjs
          node scripts/test-work-quote-response-once.mjs
          node scripts/test-work-quote-save-single-flight.mjs
          node scripts/test-work-hq-catalog-quote-bridge.mjs
          node --check services/jill-order-desk/work-catalog-stock-label.mjs
      - name: Install WORK HQ compile dependencies only
        run: |
          npm ci --prefix services/jill-order-desk/app-home --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/work-account-local --ignore-scripts --no-audit --no-fund
      - name: Verify mounted quote recovery without provider access
        run: |
          node scripts/test-work-quote-recovery-mounted.mjs
          node scripts/test-work-hq-quote-ui-wiring.mjs
      - name: Typecheck scoped HQ change
        run: npm run typecheck --prefix services/jill-order-desk/app-home
      - name: Compile HQ UI without publishing
        env:
          JILL_BUILD_TARGET: canary
        run: npm run build --prefix services/jill-order-desk/app-home
      - name: Check Worker bundle without deployment
        run: node scripts/check-work-contact-hq-bundle.mjs
