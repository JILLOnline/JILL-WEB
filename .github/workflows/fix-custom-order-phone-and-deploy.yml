name: Fix Custom Order phone parity

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - '.github/workflows/fix-custom-order-phone-and-deploy.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Core
        uses: actions/checkout@v4
        with:
          ref: jill/theme-core
          fetch-depth: 0

      - name: Apply phone parity repair
        run: python scripts/fix-custom-order-phone-parity.py

      - name: Validate Theme Core
        shell: bash
        run: |
          set -euo pipefail
          npm install
          node --check theme/assets/jill-email-validation.js
          node scripts/check-theme-core.mjs
          node scripts/test-custom-order-integration.mjs
          node scripts/check-custom-order-contract.mjs
          git diff --check

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-custom-order-phone-and-deploy.yml
          rm scripts/fix-custom-order-phone-parity.py
          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add theme/assets/jill-forms.css theme/sections/main-custom-order.liquid theme/assets/jill-email-validation.js scripts/test-custom-order-integration.mjs .github/workflows/fix-custom-order-phone-and-deploy.yml scripts/fix-custom-order-phone-parity.py
          git diff --cached --check
          git commit -m 'Fix Custom Order phone SVG parity and CSS ownership'
          git push origin HEAD:jill/theme-core
