name: Validate JILL Theme Core

on:
  workflow_dispatch:
  push:
    branches:
      - jill/theme-core
    paths:
      - 'theme/**'
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/check-theme-core.mjs'
      - 'scripts/test-form-engine.mjs'
      - 'scripts/test-product-capabilities.mjs'
      - 'scripts/test-product-options.mjs'
      - 'scripts/test-quantity.mjs'
      - 'scripts/check-custom-order-contract.mjs'
      - 'package.json'
      - '.github/workflows/validate-theme-core.yml'
  pull_request:
    paths:
      - 'theme/**'
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/check-theme-core.mjs'
      - 'scripts/test-form-engine.mjs'
      - 'scripts/test-product-capabilities.mjs'
      - 'scripts/test-product-options.mjs'
      - 'scripts/test-quantity.mjs'
      - 'scripts/check-custom-order-contract.mjs'
      - 'package.json'
      - '.github/workflows/validate-theme-core.yml'

permissions:
  contents: read

concurrency:
  group: jill-theme-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Architecture and Shopify validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and run repository postinstall guards
        run: npm install

      - name: Run Theme Core architecture guard explicitly
        run: npm run check:theme

      - name: Run universal form engine tests explicitly
        run: npm run test:form-engine

      - name: Run product capability resolver tests explicitly
        run: npm run test:product-capabilities

      - name: Run Product Options tests explicitly
        run: npm run test:product-options

      - name: Run quantity stepper tests explicitly
        run: npm run test:quantity

      - name: Run Custom Order contract guard explicitly
        run: npm run check:custom-order

      - name: Run Shopify Theme Check
        run: npx shopify theme check --path theme

      - name: Require a clean tracked worktree
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Validation modified tracked source." >&2
            git status --short
            git diff
            exit 1
          fi

# Validation only. This workflow never deploys or publishes a theme.
