name: JILL rewards watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - 'backend/google-apps-script/**'
      - 'extensions/jill-account-dashboard/**'
      - 'extensions/jill-account-coupons/**'
      - 'scripts/check-rewards-engine.mjs'
      - '.github/workflows/deploy-rewards-backend.yml'
      - '.github/workflows/rewards-watchdog.yml'

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    name: Verify rewards backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve latest successful backend deployment
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-rewards-backend.yml/runs?branch=jill%2Ftheme-core&status=success&per_page=1")"

          expected_sha="$(RESPONSE="$response" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ['RESPONSE'])
          runs = data.get('workflow_runs') or []
          if not runs:
              raise SystemExit('No successful canonical Rewards backend deployment was found.')
          print(runs[0]['head_sha'])
          PY
          )"

          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Ping JILL Rewards watchdog
        shell: bash
        env:
          WATCHDOG_URL: https://script.google.com/macros/s/AKfycbxXruH-shyIEGbxIpyJtd4KrAMaN0J3Ov7icdae_MkMvig8I_Y_fm2OJ9cRJiZ-IzU7jA/exec?jill_rewards_watchdog=1
          EXPECTED_ENGINE_VERSION: '13'
          EXPECTED_BUILD_SHA: ${{ steps.deployment.outputs.sha }}
        run: |
          set -euo pipefail
          response="$(curl -L --fail --silent --show-error --max-time 180 "$WATCHDOG_URL")"
          printf '%s\n' "$response"

          RESPONSE="$response" python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('RESPONSE', '').strip()
          expected_version = os.environ.get('EXPECTED_ENGINE_VERSION', '').strip()
          expected_build = os.environ.get('EXPECTED_BUILD_SHA', '').strip()

          try:
              data = json.loads(raw)
          except Exception as exc:
              print('JILL Rewards watchdog returned invalid JSON:', repr(raw), file=sys.stderr)
              print('Parse error:', exc, file=sys.stderr)
              sys.exit(1)

          if data.get('watchdog') is not True:
              print('JILL Rewards watchdog marker is missing:', raw, file=sys.stderr)
              sys.exit(1)

          if data.get('ok') is not True:
              print('JILL Rewards watchdog reported a failure:', raw, file=sys.stderr)
              sys.exit(1)

          engine_version = str(data.get('engine_version', '')).strip()
          if engine_version != expected_version:
              print(
                  f'JILL Rewards engine version mismatch: expected {expected_version}, got {engine_version or "missing"}',
                  file=sys.stderr,
              )
              sys.exit(1)

          build_sha = str(data.get('build_sha', '')).strip()
          if not build_sha or build_sha == '__JILL_REWARDS_BUILD_SHA__':
              print('JILL Rewards backend did not report immutable build provenance.', file=sys.stderr)
              sys.exit(1)
          if build_sha != expected_build:
              print(
                  f'JILL Rewards deployed build mismatch: expected {expected_build}, got {build_sha}',
                  file=sys.stderr,
              )
              sys.exit(1)

          promotions = data.get('promotions') or {}
          promotion_health = promotions.get('health') or {}
          if promotions.get('ok') is not True or promotion_health.get('fresh') is not True:
              print('JILL public promotions mirror is unhealthy or stale:', raw, file=sys.stderr)
              sys.exit(1)
          if promotion_health.get('trigger_ok') is not True:
              print('JILL public promotions trigger is unhealthy:', raw, file=sys.stderr)
              sys.exit(1)

          print('JILL Rewards watchdog OK:', raw)
          PY
