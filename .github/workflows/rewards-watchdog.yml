name: JILL rewards watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - 'backend/google-apps-script/**'
      - 'extensions/jill-account-dashboard/**'
      - 'extensions/jill-account-coupons/**'
      - 'scripts/check-rewards-engine.mjs'
      - '.github/workflows/rewards-watchdog.yml'

permissions:
  contents: read

jobs:
  watchdog:
    name: Verify rewards backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping JILL Rewards watchdog
        shell: bash
        env:
          WATCHDOG_URL: https://script.google.com/macros/s/AKfycbxXruH-shyIEGbxIpyJtd4KrAMaN0J3Ov7icdae_MkMvig8I_Y_fm2OJ9cRJiZ-IzU7jA/exec?jill_rewards_watchdog=1
          EXPECTED_ENGINE_VERSION: '13'
        run: |
          set -euo pipefail
          response="$(curl -L --fail --silent --show-error --max-time 180 "$WATCHDOG_URL")"
          printf '%s\n' "$response"

          RESPONSE="$response" python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('RESPONSE', '').strip()
          expected_version = os.environ.get('EXPECTED_ENGINE_VERSION', '').strip()

          try:
              data = json.loads(raw)
          except Exception as exc:
              print('JILL Rewards watchdog returned invalid JSON:', repr(raw), file=sys.stderr)
              print('Parse error:', exc, file=sys.stderr)
              sys.exit(1)

          if data.get('watchdog') is not True:
              print('JILL Rewards watchdog marker is missing:', raw, file=sys.stderr)
              sys.exit(1)

          if data.get('ok') is not True:
              print('JILL Rewards watchdog reported a failure:', raw, file=sys.stderr)
              sys.exit(1)

          engine_version = str(data.get('engine_version', '')).strip()
          if engine_version != expected_version:
              print(
                  f'JILL Rewards engine version mismatch: expected {expected_version}, got {engine_version or "missing"}',
                  file=sys.stderr,
              )
              sys.exit(1)

          print('JILL Rewards watchdog OK:', raw)
          PY
