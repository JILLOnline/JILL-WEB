name: Patch Rewards spacing and rail

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-rewards-spacing-rail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Equalize spacing, align dots, and connect rail
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('extensions/jill-account-dashboard/src/Dashboard.jsx')
          text = path.read_text()

          new_function = r'''  function rewardMilestone(tier, previousPoints) {
    const isUnlocked = points >= tier.points;
    const isNext = tier.points === nextTier?.points;
    const tierProgress = Math.max(0, Math.min(points, tier.points));
    const progressValue = tierProgress === 0 ? 0.001 : tierProgress;
    const pointsRemaining = Math.max(0, tier.points - points);
    const isPendingTier = pendingPoints === tier.points;
    const isFirst = previousPoints === 0;
    const isLast = tier.points === REWARD_TIERS[REWARD_TIERS.length - 1].points;
    const showTopRail = showAllRewards && !isFirst;
    const showBottomRail = showAllRewards && !isLast;

    return (
      <s-grid
        key={`journey-${tier.points}`}
        gridTemplateColumns="32px minmax(0, 1fr)"
        gap="small-300"
        blockAlignment="stretch"
      >
        <s-grid
          gridTemplateRows="1fr auto 1fr"
          blockSize="100%"
          justifyItems="center"
          alignItems="stretch"
        >
          {showTopRail ? (
            <s-stack direction="inline" justifyContent="center">
              <s-box inlineSize={1} blockSize="100%" border="large base solid" />
            </s-stack>
          ) : (
            <s-box />
          )}

          <s-stack direction="inline" justifyContent="center" alignItems="center">
            <s-icon
              type={isUnlocked ? 'check-circle-filled' : 'circle'}
              tone={isUnlocked ? 'success' : isNext ? 'info' : 'neutral'}
              size="small-200"
            />
          </s-stack>

          {showBottomRail ? (
            <s-stack direction="inline" justifyContent="center">
              <s-box inlineSize={1} blockSize="100%" border="large base solid" />
            </s-stack>
          ) : (
            <s-box />
          )}
        </s-grid>

        <s-box
          padding="small-300"
          background={isUnlocked || isNext ? 'base' : 'subdued'}
          borderRadius="large"
          border="base base solid"
        >
          <s-stack direction="block" gap="small-200">
            <s-stack direction="inline" justifyContent="space-between" alignItems="center">
              <s-stack direction="inline" gap="small-200" alignItems="center">
                <s-heading>${tier.value} OFF</s-heading>
                <s-text color="subdued">${tier.minimum} minimum order</s-text>
              </s-stack>
              {isUnlocked ? (
                <s-badge tone="success">Unlocked ✓</s-badge>
              ) : isNext ? (
                <s-badge tone="info">Next reward ★</s-badge>
              ) : (
                <s-badge tone="neutral">{tier.points} pts</s-badge>
              )}
            </s-stack>

            <s-stack direction="block" gap="small-100">
              <s-progress
                value={progressValue}
                max={tier.points}
                accessibilityLabel={`${tierProgress} of ${tier.points} points toward $${tier.value} OFF`}
              />
              <s-text type="strong">
                {tierProgress} / {tier.points} pts · {isUnlocked ? 'Unlocked' : `${pointsRemaining} ${pointsRemaining === 1 ? 'point' : 'points'} to unlock`}
              </s-text>
            </s-stack>

            {isUnlocked && !activeCouponCode && !pendingPoints && (
              <s-button
                variant={tier.points === unlocked?.points ? 'primary' : 'secondary'}
                onClick={() => handleRedeem(tier)}
              >
                Redeem ${tier.value} OFF
              </s-button>
            )}

            {isPendingTier && (
              <s-text type="strong" tone="info">Creating this reward… ✨</s-text>
            )}
          </s-stack>
        </s-box>
      </s-grid>
    );
  }

  function rewardConnector() {
    return (
      <s-grid gridTemplateColumns="32px minmax(0, 1fr)" gap="small-300">
        <s-stack direction="inline" justifyContent="center">
          <s-box inlineSize={1} blockSize={18} border="large base solid" />
        </s-stack>
        <s-box blockSize={18} />
      </s-grid>
    );
  }
'''

          pattern = r'  function rewardMilestone\(tier, previousPoints\) \{.*?\n  \}\n\n  return \('
          text, count = re.subn(pattern, new_function + '\n  return (', text, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('Could not replace rewardMilestone function exactly once.')

          old_render = '''            <s-stack direction="block" gap="small-200">
              {rewardMilestone(REWARD_TIERS[0], 0)}

              {showAllRewards && (
                <s-stack direction="block" gap="none">
                  {REWARD_TIERS.slice(1).map((tier, index) =>
                    rewardMilestone(tier, REWARD_TIERS[index].points),
                  )}
                </s-stack>
              )}
'''

          new_render = '''            <s-stack direction="block" gap="small-300">
              <s-stack direction="block" gap="none">
                {(showAllRewards ? REWARD_TIERS : REWARD_TIERS.slice(0, 1)).map(
                  (tier, index, visibleTiers) => (
                    <s-stack key={`reward-group-${tier.points}`} direction="block" gap="none">
                      {rewardMilestone(tier, index === 0 ? 0 : visibleTiers[index - 1].points)}
                      {index < visibleTiers.length - 1 && rewardConnector()}
                    </s-stack>
                  ),
                )}
              </s-stack>
'''

          if old_render not in text:
            raise SystemExit('Could not find current Rewards render block exactly.')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-rewards-spacing-rail.yml
          git config user.name "JILL Rewards automation"
          git config user.email "info@jillonlinestore.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx .github/workflows/patch-rewards-spacing-rail.yml
          git commit -m "Equalize reward spacing and connect milestone rail"
          git push origin HEAD:main
