name: Finalize content shell review

on:
  push:
    branches:
      - jill/content-page-shell
    paths:
      - .github/workflows/finalize-content-shell-review.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/content-page-shell
          fetch-depth: 0

      - name: Apply review fixes
        run: python3 .github/content_shell_review_fix.py

      - name: Remove temporary helpers
        run: git rm .github/workflows/finalize-content-shell-review.yml .github/content_shell_review_fix.py

      - name: Commit review fixes
        run: |
          git config user.name "JILL Web Automation"
          git config user.email "info@jillonlinestore.com"
          git add theme scripts .github
          git commit -m "Address content shell architecture review"
          git push origin HEAD:jill/content-page-shell
