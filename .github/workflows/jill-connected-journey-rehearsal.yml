name: JILL WORK three-lane customer journey integration
# Source-only integration rehearsal: NO remote merge, push, deploy, DB write,
# customer message, Shopify API, paid Cloudflare usage or live system change.
on:
  push:
    branches:
      - 'jill/connected-journey-*'
  pull_request:
    branches:
      - jill/hq-quote-catalog-preflight-20261022
      - jill/connected-journey-three-lane-20261024
      - jill/connected-journey-pinned-rehearsal-20261026
      - jill/connected-journey-account-retry-20261026
      - jill/connected-journey-independent-polish-20261026
      - jill/connected-journey-recovery-qa-20261026
      - jill/connected-journey-item-context-20261026
      - jill/connected-journey-bounded-prefetch-20261026
      - jill/connected-journey-lease-focus-20261026
      - jill/connected-journey-quote-readback-20261026
      - jill/connected-journey-quote-guidance-20261026
      - jill/connected-journey-quote-once-search-20261026
    paths:
      - '.github/workflows/jill-connected-journey-rehearsal.yml'
      - 'scripts/test-work-connected-three-surface-contract.mjs'
      - 'scripts/test-work-unified-owner-queue.mjs'
      - 'scripts/test-work-quote-sqlite-roundtrip.mjs'
      - 'scripts/test-work-quote-http-sqlite-roundtrip.mjs'
      - 'scripts/test-work-contact-sqlite-customer-readback.mjs'
      - 'scripts/test-work-contact-message-readback-policy.mjs'
      - 'scripts/test-work-contact-customer-reply-sqlite.mjs'
      - 'backend/work-contact-customer-reply.mjs'
      - 'backend/work-contact-conversation-v2.mjs'
      - 'shared/customer-contact-conversation-v2.mjs'
      - 'scripts/test-work-contact-owner-customer-replies.mjs'
      - 'services/jill-order-desk/work-contact-ticket-detail.mjs'
      - 'services/jill-order-desk/app-home/app/routes/app.contacts.$ticketId.tsx'
      - 'services/jill-order-desk/migrations/0005_work_contact_customer_replies_source_only.sql'
      - 'services/jill-order-desk/work-contact-private-bridge.mjs'
      - 'services/custom-order-cloudflare/handler.mjs'
      - 'services/jill-order-desk/work-contact-message-readback-policy.mjs'
      - 'services/jill-order-desk/app-home/app/routes/app.contacts.$ticketId.tsx'
      - 'services/jill-order-desk/work-unified-owner-queue.mjs'
      - 'services/jill-order-desk/app-home/app/routes/app.queue-unified.tsx'
      - 'services/jill-order-desk/app-home/app/routes/app.inquiries.tsx'
      - 'services/jill-order-desk/app-home/app/styles/hq-inquiries.css'
      - 'services/jill-order-desk/app-home/app/routes.ts'
      - 'services/jill-order-desk/app-home/workers/app.ts'
      - 'docs/WORK_CONNECTED_THREE_LANE_20261024.md'
      - 'scripts/attest-work-connected-source.mjs'
      - 'scripts/test-work-joined-hq-invariants.mjs'
      - 'scripts/test-work-quote-recovery-mounted.mjs'
      - '**/package-lock.json'
permissions:
  contents: read

jobs:
  source-join:
    name: Reconcile HQ + My JILL + visual PRs in disposable worktree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout three-lane orchestration source without deploy credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Fetch exact existing WORK draft lanes (never push)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/jill/myjill-order-search-deeplink-20261027:refs/remotes/origin/jill/myjill-order-search-deeplink-20261027 \
            refs/heads/jill/hq-quote-save-single-flight-20261027:refs/remotes/origin/jill/hq-quote-save-single-flight-20261027
          echo 'Three remote SOURCE references fetched; no release configuration changed.'
      - name: Rehearse three-way WORK source integration; deny unresolved conflicts
        shell: bash
        run: |
          set -euo pipefail
          MY_SHA="$(git rev-parse refs/remotes/origin/jill/myjill-order-search-deeplink-20261027)"
          VIS_SHA="$(git rev-parse refs/remotes/origin/jill/hq-quote-save-single-flight-20261027)"
          # Immutable source provenance: a successful rehearsal must mean
          # THESE EXACT reviewed lane commits were merged, not moving HEADs.
          # A new draft commit intentionally produces HOLD until reviewed
          # and both pins are explicitly updated in a separate source PR.
          EXPECTED_MY_SHA="a93f601e2864028c7e9671a946e3bdac7c553282"
          EXPECTED_VIS_SHA="c9129160b43a6498e91f7386bae7407223b67823"
          if [[ "$MY_SHA" != "$EXPECTED_MY_SHA" || "$VIS_SHA" != "$EXPECTED_VIS_SHA" ]]; then
            echo 'HOLD: My JILL/HQ visuals draft moved since reviewed integration source.'
            echo 'Review the changed lane before intentionally updating both source pins.'
            exit 1
          fi
          echo 'PINNED_SOURCE_PROVENANCE=verified'
          ROOT="$(pwd)"
          DIR="$RUNNER_TEMP/jill-work-3lane-rehearsal"
          git worktree add --detach "$DIR" HEAD
          cd "$DIR"
          git config user.name 'JILL Source QA (Ephemeral)'
          git config user.email 'source-qa@invalid.example'
          printf 'INTEGRATION_SOURCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'MY_JILL_SOURCE_HEAD=%s\n' "$MY_SHA"
          printf 'VISUAL_SOURCE_HEAD=%s\n' "$VIS_SHA"
          # Approved selected order: HQ ancestry, then My JILL ancestry.
          for candidate in "$VIS_SHA" "$MY_SHA"; do
            if ! git merge --no-ff --no-edit "$candidate" > /tmp/jill-work-join-result.log 2>&1; then
              echo 'HOLD: Source merge has conflicts; DO NOT infer the drafts are integrated.'
              git diff --name-only --diff-filter=U | head -60
              exit 1
            fi
          done
          test -f scripts/test-work-connected-three-surface-contract.mjs
          test -f services/jill-order-desk/app-home/app/styles/hq-visual-polish.css
          test -f extensions/jill-account-dashboard/src/pages/Messages.jsx
          echo "INTEGRATED_EPHEMERAL_HEAD=$(git rev-parse HEAD)"
          echo "INTEGRATED_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          echo 'NO_GITHUB_BRANCH_UPDATE=true'
          echo 'NO_WORKER_DEPLOYMENT=true'
          # Subsequent steps share this isolated worktree, NOT the source checkout.
          echo "JILL_EPHEMERAL_JOIN=$DIR" >> "$GITHUB_ENV"
      - name: Exercise real joined HQ and My JILL source contracts with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          cd "$JILL_EPHEMERAL_JOIN"
          JILL_HQ_SOURCE_DIR="$PWD" node scripts/test-work-cross-pr-contact-integration.mjs
          node scripts/test-work-connected-three-surface-contract.mjs
          node scripts/test-myjill-customer-home.mjs
          node scripts/test-myjill-visual-polish-source.mjs
          node scripts/test-myjill-customer-next-step-journey.mjs
          node scripts/test-myjill-work-preview-readiness.mjs
          node scripts/test-myjill-signed-preview-command.mjs
          node scripts/test-myjill-work-canary-module-graph.mjs
          # Includes signed Shopify identity retry, failed/guest privacy fence,
          # and stale async completion guard from the reviewed My JILL recovery source.
          node scripts/test-myjill-account-switch-fence.mjs
          node scripts/test-myjill-mobile-inbox.mjs
          node scripts/test-account-hub-summary.mjs
          node scripts/inspect-myjill-work-preview-readiness.mjs
          node scripts/test-myjill-mobile-orders-rewards.mjs
          node scripts/test-myjill-contact-v2-source.mjs
          node scripts/test-myjill-contact-draft-navigation.mjs
          node scripts/test-account-hub-template.mjs
          node scripts/test-work-unified-owner-queue.mjs
          node scripts/test-work-contact-worker-routing.mjs
          node scripts/test-work-contact-private-e2e.mjs
          node --no-warnings scripts/test-work-contact-sqlite-customer-readback.mjs
          node scripts/test-work-contact-message-readback-policy.mjs
          node --no-warnings scripts/test-work-contact-customer-reply-sqlite.mjs
          node scripts/test-work-contact-owner-customer-replies.mjs
          node scripts/test-work-contact-message-bridge.mjs
          node scripts/test-work-myjill-contact-claim.mjs
          node scripts/test-work-myjill-contact-thread.mjs
          node scripts/test-work-myjill-account-response-integrity.mjs
          node scripts/test-work-customer-message-navigation.mjs
          node scripts/test-work-customer-message-operation-races.mjs
          node scripts/test-work-message-inboxes.mjs
          node scripts/test-work-hq-quote-owner-ui.mjs
          node scripts/test-work-quote-calculation.mjs
          node --no-warnings scripts/test-work-quote-sqlite-roundtrip.mjs
          node --no-warnings scripts/test-work-quote-http-sqlite-roundtrip.mjs
          node scripts/test-work-hq-catalog-quote-bridge.mjs
          node scripts/test-work-catalog-stock-label.mjs
          node scripts/test-work-hq-request-detail-recovery.mjs
          node scripts/test-work-hq-inbox-item-preview.mjs
          node scripts/test-work-hq-bounded-detail-prefetch.mjs
          node scripts/test-work-hq-inbox-ui.mjs
          node scripts/test-work-quote-reload-revision-guard.mjs
          node scripts/test-work-quote-recovery-guidance.mjs
          node scripts/test-work-quote-response-once.mjs
          node scripts/test-work-quote-save-single-flight.mjs
          node scripts/test-work-myjill-reply-capability.mjs
          node scripts/test-work-quote-commerce-handoff.mjs
          node scripts/test-work-joined-hq-invariants.mjs
          node scripts/test-work-hq-branding.mjs
          node scripts/test-work-hq-quote-ui-wiring.mjs
          echo 'JOINED_SYNTHETIC_CUSTOMER_A_B_GUEST_CHECKS=passed'
      - name: Install WORK HQ dependencies for offline compile only
        shell: bash
        run: |
          cd "$JILL_EPHEMERAL_JOIN"
          npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/jill-order-desk/app-home --ignore-scripts --no-audit --no-fund
          npm ci --prefix extensions/jill-account-dashboard --workspaces=false --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/work-account-local --ignore-scripts --no-audit --no-fund
      - name: Repository guards and actual mounted quote lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd "$JILL_EPHEMERAL_JOIN"
          npm run postinstall
          node scripts/test-work-quote-recovery-mounted.mjs
          node scripts/test-work-hq-inbox-mounted.mjs
      - name: Compile both My JILL entrypoints without publishing
        shell: bash
        run: |
          set -euo pipefail
          cd "$JILL_EPHEMERAL_JOIN"
          services/jill-order-desk/app-home/node_modules/.bin/esbuild \
            extensions/jill-account-dashboard/src/Dashboard.jsx \
            extensions/jill-account-dashboard/src/hub/ConnectedHub.jsx \
            --bundle --platform=browser --format=esm \
            --jsx=automatic --jsx-import-source=preact \
            --external:@shopify/ui-extensions/preact \
            --outdir="$RUNNER_TEMP/jill-myjill-bundles"
      - name: Typecheck joined HQ routes, including visual quote disclosure
        shell: bash
        run: npm run typecheck --prefix "$JILL_EPHEMERAL_JOIN/services/jill-order-desk/app-home"
      - name: Build joined HQ WORK UI without upload
        shell: bash
        env:
          JILL_BUILD_TARGET: canary
        run: npm run build --prefix "$JILL_EPHEMERAL_JOIN/services/jill-order-desk/app-home"
      - name: Check built Worker entrypoint without deployment
        shell: bash
        run: |
          cd "$JILL_EPHEMERAL_JOIN"
          node scripts/check-work-contact-hq-bundle.mjs
          echo 'WORK_SOURCE_JOIN_COMPILED=true'
          echo 'MY_JILL_EXTENSION_PUBLISHED=false'
          echo 'WORK_TRAFFIC_UNCHANGED=true'
          echo 'LIVE_KEEP_UNCHANGED=true'
      - name: Exercise compiled Worker locally with synthetic D1 and OFF flags
        shell: bash
        run: |
          cd "$JILL_EPHEMERAL_JOIN/services/jill-order-desk/app-home"
          npm run test:workerd-connected-read-local
      - name: Record exact joined tree, dependency locks and artifact digests
        shell: bash
        env:
          JILL_SOURCE_RECEIPT: ${{ runner.temp }}/jill-source-receipt.json
          JILL_MYJILL_BUNDLES: ${{ runner.temp }}/jill-myjill-bundles
        run: |
          cd "$JILL_EPHEMERAL_JOIN"
          node scripts/attest-work-connected-source.mjs
      - name: Retain source-only receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jill-connected-source-receipt
          path: ${{ runner.temp }}/jill-source-receipt.json
          retention-days: 7
          if-no-files-found: error
