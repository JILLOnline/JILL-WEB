name: Patch reward generation enqueue flow

on:
  push:
    branches:
      - jill/rewards-generate-fix
    paths:
      - '.github/workflows/patch-rewards-generate-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/rewards-generate-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch canonical reward request transport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard_path = Path('extensions/jill-account-dashboard/src/Dashboard.jsx')
          source = dashboard_path.read_text()

          old = "const API = 'shopify://customer-account/api/2026-07/graphql.json';\nconst STORE = 'https://jillonlinestore.com';\nconst REWARDS_REFRESH_MS = 25000;"
          new = "const API = 'shopify://customer-account/api/2026-07/graphql.json';\nconst WRITE_API = 'shopify:customer-account/api/2026-07/graphql.json';\nconst STORE = 'https://jillonlinestore.com';\nconst REWARDS_REFRESH_MS = 25000;\nconst REWARD_REQUEST_TIMEOUT_MS = 10000;"
          assert old in source, 'API constants anchor not found'
          source = source.replace(old, new, 1)

          pattern = re.compile(r"async function requestReward\(customerId, points\) \{.*?\n\}\n\nfunction wait\(milliseconds\)", re.S)
          match = pattern.search(source)
          assert match, 'requestReward block not found'
          replacement = '''async function requestReward(customerId, points) {
            const nonce = createRewardNonce();
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), REWARD_REQUEST_TIMEOUT_MS);

            try {
              const response = await fetch(WRITE_API, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                signal: controller.signal,
                body: JSON.stringify({
                  query: REQUEST_REWARD_MUTATION,
                  variables: {
                    metafields: [
                      {
                        ownerId: customerId,
                        namespace: 'jill_rewards',
                        key: 'redeem_request_points',
                        type: 'number_integer',
                        value: String(points),
                      },
                      {
                        ownerId: customerId,
                        namespace: 'jill_rewards',
                        key: 'redeem_request_nonce',
                        type: 'single_line_text_field',
                        value: nonce,
                      },
                    ],
                  },
                }),
              });

              const payload = await response.json();
              const userErrors = payload?.data?.metafieldsSet?.userErrors || [];
              if (!response.ok || payload?.errors?.length || userErrors.length) {
                throw new Error(
                  userErrors?.[0]?.message ||
                    payload?.errors?.[0]?.message ||
                    'Unable to request your JILL reward right now.',
                );
              }

              const written = payload?.data?.metafieldsSet?.metafields;
              if (!Array.isArray(written) || ![
                ['redeem_request_points', String(points)],
                ['redeem_request_nonce', nonce],
              ].every(([key, value]) => written.some((field) =>
                field?.namespace === 'jill_rewards' && field.key === key && field.value === value,
              ))) {
                throw new Error('Shopify did not confirm your reward request. Refresh your rewards before trying again.');
              }
              return nonce;
            } catch (error) {
              if (error?.name === 'AbortError') {
                throw new Error(
                  'JILL could not start your reward request in time. Your points were not changed. Please try again.',
                );
              }
              throw error;
            } finally {
              clearTimeout(timeoutId);
            }
          }

          function wait(milliseconds)'''
          source = source[:match.start()] + replacement + source[match.end():]
          dashboard_path.write_text(source)

          test_path = Path('scripts/test-rewards-redemption.mjs')
          test = test_path.read_text()

          old = "const api = vm.createContext({API: 'shopify://customer-account/api/2026-07/graphql.json', QUERY: 'query {}'});"
          new = "const api = vm.createContext({\n  API: 'shopify://customer-account/api/2026-07/graphql.json',\n  WRITE_API: 'shopify:customer-account/api/2026-07/graphql.json',\n  QUERY: 'query {}',\n  REWARD_REQUEST_TIMEOUT_MS: 10000,\n  AbortController,\n  setTimeout,\n  clearTimeout,\n});"
          assert old in test, 'transport VM anchor not found'
          test = test.replace(old, new, 1)

          old = '''api.fetch = async (_url, options) => {
            const {variables} = JSON.parse(options.body);
            assert.deepEqual(variables.metafields.map((f) => f.key), ['redeem_request_points', 'redeem_request_nonce']);'''
          new = '''api.fetch = async (url, options) => {
            assert.equal(url, 'shopify:customer-account/api/2026-07/graphql.json');
            assert.ok(options.signal);
            const {variables} = JSON.parse(options.body);
            assert.deepEqual(variables.metafields.map((f) => f.key), ['redeem_request_points', 'redeem_request_nonce']);'''
          assert old in test, 'mutation fetch assertion anchor not found'
          test = test.replace(old, new, 1)

          marker = "assert.match(await api.requestReward('gid://shopify/Customer/1', 10), /^jill:/);"
          addition = marker + "\nassert.equal(api.REWARD_REQUEST_TIMEOUT_MS, 10000);"
          assert marker in test, 'request success assertion anchor not found'
          test = test.replace(marker, addition, 1)

          test_path.write_text(test)
          PY

      - name: Run full repository guards
        run: npm install

      - name: Run focused Rewards redemption regression
        run: node scripts/test-rewards-redemption.mjs

      - name: Commit canonical fix
        shell: bash
        run: |
          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add extensions/jill-account-dashboard/src/Dashboard.jsx scripts/test-rewards-redemption.mjs
          git diff --cached --check
          git commit -m 'Fix customer reward request enqueue'
          git push origin HEAD:jill/rewards-generate-fix
