name: Section 4 One Shot

on:
  push:
    branches:
      - jill/custom-order-section4-system-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: jill/custom-order-section4-system-pass
          fetch-depth: 0

      - name: Apply Section 4 big pass
        run: python scripts/section4_big_pass.py

      - name: Commit patched Section 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/assets/jill-custom-order.js theme/assets/jill-forms.css scripts/test-custom-order-integration.mjs
          git diff --cached --check
          git commit -m "Rebuild Section 4 quantity personalization"
          git push origin HEAD:jill/custom-order-section4-system-pass
