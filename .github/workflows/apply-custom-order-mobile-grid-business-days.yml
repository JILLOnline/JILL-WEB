name: Apply Custom Order deep mobile fix

on:
  push:
    branches:
      - jill/custom-order-mobile-grid-business-days

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: jill/custom-order-mobile-grid-business-days
          fetch-depth: 0

      - name: Apply guarded transformation
        run: python scripts/apply-custom-order-mobile-grid-business-days.py

      - name: Run focused Custom Order guard
        run: node scripts/test-custom-order-integration.mjs

      - name: Remove one-time tooling and commit result
        shell: bash
        run: |
          rm .github/workflows/apply-custom-order-mobile-grid-business-days.yml
          rm scripts/apply-custom-order-mobile-grid-business-days.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/assets/jill-forms.css theme/assets/jill-custom-order.js scripts/test-custom-order-integration.mjs .github/workflows/apply-custom-order-mobile-grid-business-days.yml scripts/apply-custom-order-mobile-grid-business-days.py
          git commit -m "Fix Custom Order mobile grid and date lead time"
          git push origin HEAD:jill/custom-order-mobile-grid-business-days
