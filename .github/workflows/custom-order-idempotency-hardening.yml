name: Harden Custom Order Email Idempotency

on:
  pull_request:
    branches:
      - jill/theme-core

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'jill/custom-order-email-pipeline'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce at-most-once automatic email send
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs')
          source = path.read_text()
          old = "function emailStageShouldAttempt_(stage) {\n  return stage === 'PENDING' || stage === 'ERROR';\n}"
          new = "function emailStageShouldAttempt_(stage) {\n  // Only a never-attempted email may be sent automatically. ERROR and\n  // ATTEMPTING are terminal for network retries so an ambiguous MailApp\n  // outcome cannot create a duplicate customer or merchant message.\n  return stage === 'PENDING';\n}"
          if old not in source:
              raise SystemExit('Expected emailStageShouldAttempt_ body not found')
          source = source.replace(old, new, 1)
          path.write_text(source)

      - name: Validate backend guards
        run: |
          npm install --ignore-scripts
          node scripts/check-rewards-engine.mjs
          node scripts/test-rewards-engine.mjs
          node scripts/check-custom-order-contract.mjs
          node scripts/test-custom-order-integration.mjs
          git diff --check
          test -z "$(git diff --name-only -- theme)"

      - name: Remove temporary workflow and commit
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/custom-order-idempotency-hardening.yml
          git config user.name 'JILL Backend Automation'
          git config user.email 'info@jillonlinestore.com'
          git add backend/google-apps-script/JILL_Custom_Order_Automation_REWARDS.gs
          git commit -m 'Harden Custom Order email idempotency'
          git push origin "HEAD:${HEAD_BRANCH}"
