name: One-time reward pill visual fix
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-reward-pills.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore compact reward pills and apply color only
        run: python -c "from pathlib import Path;import base64;p=Path('extensions/jill-account-dashboard/src/Dashboard.jsx');s=p.read_text();a=s.index('  function rewardStatusControl(');b=s.index('\\n  function rewardMilestone(',a);n=base64.b64decode('').decode();s=s[:a]+n+s[b:];s=s.replace(base64.b64decode('dHlwZT17aXNBY2hpZXZlZCA/ICdjaGVjay1jaXJjbGUtZmlsbGVkJyA6IGlzTmV4dCA/ICdzdGFyLWZpbGxlZCcgOiAnY2lyY2xlJ31cbiAgICAgICAgICAgICAgdG9uZT17aXNSZWRlZW1lZCA/ICdpbmZvJyA6IGlzQWNoaWV2ZWQgPyAnc3VjY2VzcycgOiBpc05leHQgPyAnY3VzdG9tJyA6ICduZXV0cmFsJ30=').decode(),base64.b64decode('dHlwZT17aXNBY2hpZXZlZCA/ICdjaGVjay1jaXJjbGUtZmlsbGVkJyA6ICdjaXJjbGUnfVxuICAgICAgICAgICAgICB0b25lPXtpc0FjaGlldmVkID8gJ3N1Y2Nlc3MnIDogaXNOZXh0ID8gJ2luZm8nIDogJ25ldXRyYWwnfQ==').decode());p.write_text(s)"
      - name: Commit fix
        run: |
          git config user.name "JILLOnline"
          git config user.email "info@jillonlinestore.com"
          git add extensions/jill-account-dashboard/src/Dashboard.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore compact reward pills with status colors"
            git push
          fi
