name: Repair Rewards write transport

on:
  push:
    branches: [jill/rewards-write-protocol]
    paths:
      - '.github/workflows/repair-rewards-write-protocol.yml'
      - '.github/repair_rewards_write_protocol.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jill/rewards-write-protocol
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply documented Customer Account write protocol
        run: python .github/repair_rewards_write_protocol.py
      - name: Run repository guards
        run: npm install
      - name: Commit repair
        run: |
          git config user.name JILLOnline
          git config user.email info@jillonlinestore.com
          git add extensions/jill-account-dashboard/src/Dashboard.jsx scripts/test-rewards-redemption.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m "Use documented Customer Account write protocol"
          git push origin HEAD:jill/rewards-write-protocol
