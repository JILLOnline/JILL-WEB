name: One-time fix Custom Order submit regression

on:
  push:
    branches:
      - jill/theme-core
    paths:
      - '.github/workflows/fix-custom-order-submit-regression.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Core
        uses: actions/checkout@v4
        with:
          ref: jill/theme-core
          fetch-depth: 0

      - name: Apply Custom Order submit repair
        run: python scripts/fix-custom-order-submit-regression.py

      - name: Validate Theme Core
        shell: bash
        run: |
          set -euo pipefail
          npm install
          node --check theme/assets/jill-custom-order.js
          node scripts/test-custom-order-integration.mjs
          node scripts/check-custom-order-contract.mjs
          node scripts/check-theme-core.mjs
          git diff --check

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-custom-order-submit-regression.yml
          rm scripts/fix-custom-order-submit-regression.py
          git config user.name 'JILLOnline'
          git config user.email 'info@jillonlinestore.com'
          git add theme/assets/jill-custom-order.js theme/sections/main-custom-order.liquid scripts/test-custom-order-integration.mjs .github/workflows/fix-custom-order-submit-regression.yml scripts/fix-custom-order-submit-regression.py
          git diff --cached --check
          git commit -m 'Fix Custom Order submission regression'
          git push origin HEAD:jill/theme-core
