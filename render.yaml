# JILL WORK Custom Orders QA only. NOTHING here deploys the LIVE store.
# Blueprint resources may incur charges when the merchant syncs it.
# Auto-deploy is disabled until E2E receipts pass.
services:
  - type: web
    name: jill-work-custom-order-gateway
    runtime: node
    repo: https://github.com/JILLOnline/JILL-WEB
    branch: jill/rewards-work
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: off
    buildCommand: npm install --prefix services/custom-order-work-gateway --omit=dev --ignore-scripts
    startCommand: node services/custom-order-work-gateway/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_WORK_APP_SECRET
        sync: false
      - key: JILL_CUSTOM_ORDER_GATEWAY_SECRET
        sync: false
      - key: JILL_CUSTOM_ORDER_QA_BACKEND_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jill-work-custom-orders-rate-limit
          property: connectionString

  - type: keyvalue
    name: jill-work-custom-orders-rate-limit
    region: virginia
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []
